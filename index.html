<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CristianEntrenador</title>
<meta name="description" content="Tu rutina personalizada de VivaGym con CristianEntrenador.">
<meta name="theme-color" content="#0a0a0b">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CristianEntrenador">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de móvil a una columna (máx 480px), cabecera fija de sesión, tarjetas por ejercicio con series apiladas. Look único navy de marca. */
:root{
  --bg:#0a0a0b; --surface:#161618; --surface-2:#232326; --line:rgba(255,255,255,.08);
  --fg:#f5f5f5; --muted:#8d8d93; --accent:#ff8a3d; --accent-ink:#0a0a0b;
  --backoff:#8fb0ff; --backoff2:#c3b5ff; --ok:#4ade80; --warn:#facc15;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:480px;margin:0 auto;padding-block:20px 120px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Acceso ---------- */
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:28px}
.brand{font-family:var(--display);font-weight:900;font-size:56px;letter-spacing:.01em;line-height:.9;text-transform:uppercase}
.brand span{color:var(--accent)}
.brand-sub{color:var(--muted);margin-top:8px;max-width:30ch}
.code-box{display:flex;flex-direction:column;gap:12px}
.code-box label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
#code{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;
  font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.18em;text-align:center;text-transform:uppercase}
#code:focus{border-color:var(--accent);outline:none}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:16px;font-weight:700;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:22px;font-size:14px;color:var(--warn)}
.demo-hint{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.demo-hint b{color:var(--fg);letter-spacing:.08em}

/* ---------- Sesión ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.week{font-size:13px;color:var(--muted)}
.out{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto}
.day{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.progress{height:4px;background:var(--surface);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.ex-list{display:flex;flex-direction:column;gap:18px;margin-top:18px}

.ex{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-idx{font-family:var(--display);font-weight:900;font-size:15px;color:var(--accent);letter-spacing:.06em}
.ex-name{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.ex-meta{font-size:13px;color:var(--muted)}
.see{flex:0 0 auto;background:var(--surface-2);border:0;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.cues{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.cues .vid{aspect-ratio:16/9;max-width:100%;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font-size:13px;margin-bottom:6px}
.cues b{color:var(--fg)}
/* Notas de Cristian en pequeño (ex.memo / day.memo) */
.memo{font-size:11.5px;line-height:1.35;color:var(--muted);margin-top:4px}.memo b{color:var(--accent);font-weight:600}
.day-memo{margin:0 0 10px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px}

.set{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.set-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:1px solid currentColor}
.tag.aprox{color:var(--muted)}
.tag.top{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.tag.bo{color:var(--backoff)}
.tag.bo2{color:var(--backoff2)}
.target{font-size:14px;font-weight:600}
.prev{font-size:12px;color:var(--muted);margin-left:auto}
.nums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.9fr) 44px;gap:6px}
.nums.ro{grid-template-columns:minmax(0,1fr) minmax(0,1.9fr) 44px}
.last{align-self:end;min-height:46px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);padding:4px 8px;display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.2}
.last-lab{font-size:9.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last-v{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last-x{font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field input{padding:10px 8px!important;font-size:18px!important}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input{width:100%;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--accent);outline:none}
.check{align-self:end;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;color:var(--muted)}
.set.done .check{background:var(--ok);border-color:var(--ok);color:var(--bg)}
/* Ejercicios de "solo marcar hecho" (estiramientos): sin kg, reps ni RPE */
.ok-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ok-row .field{flex:1;max-width:150px}
.ok-row .field small{text-transform:none;letter-spacing:0;font-weight:400}
.ok-row .check{align-self:end;font-size:15px;font-weight:700;padding:0 18px;min-width:120px}
.tag.ok{color:var(--ok)}
.rp-t.ok{color:#2e8b57}
.set.done .field input{border-color:transparent;color:var(--ok)}
.scale{display:grid;grid-template-columns:38px 1fr;align-items:center;gap:8px}
.scale .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chips{display:grid;gap:4px}
.chips.c10{grid-template-columns:repeat(10,1fr)}
.chips.c4{grid-template-columns:repeat(4,1fr)}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);min-width:0}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips.c4 .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.finish-bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--bg) 35%);
  padding:28px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.finish-bar .btn{display:block;width:100%;max-width:480px;margin:0 auto}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(6,9,26,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{max-height:100dvh;overflow-y:auto;background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;
  padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{margin:0;font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat strong{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.paper{background:#fbfaf7;color:#1a2247;border-radius:10px;padding:16px;max-height:40vh;overflow:auto;font-size:12px;display:flex;flex-direction:column;gap:10px}
.paper-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #ff8a3d;padding-bottom:8px;gap:10px}
.paper-brand{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;line-height:1}
.paper-brand span{color:#e06a1c}
.paper-meta{text-align:right;color:#4a5280;font-size:11px}
.paper h3{margin:0;font-family:var(--display);font-size:15px;font-weight:800;text-transform:uppercase}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#4a5280;font-weight:600;padding:3px 4px;border-bottom:1px solid #d9dcea}
.paper td{padding:4px;border-bottom:1px solid #eceef5}
.paper td.miss{color:#9aa0bd}
.paper-foot{color:#4a5280;font-size:11px}
.share-row{display:flex;flex-direction:column;gap:8px}
.note{font-size:12px;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:600}
/* ---------- Foto y vídeo del ejercicio ---------- */
.media{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.m-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border-radius:10px;padding:3px}
.m-tab{background:none;border:0;border-radius:8px;padding:8px;font-size:13px;font-weight:700;color:var(--muted)}
.m-tab[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.m-pane{display:flex;flex-direction:column;align-items:center;gap:8px}
.short{width:100%;max-width:280px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;display:grid;place-items:center}
.short iframe{width:100%;height:100%;border:0;display:block}
.yt-link{font-size:12px;color:var(--muted)}
.short.wide{max-width:100%;aspect-ratio:16/9}
.v-lab{font-size:12px;color:var(--fg);font-weight:600;align-self:flex-start}
.warm-t a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(151,160,198,.4);text-underline-offset:2px}
.m-photo{width:100%;max-width:340px;border-radius:14px;display:block;margin:0 auto;background:#fff}
/* ---------- ¿Qué trabajo? ---------- */
.m-tabs.three{grid-template-columns:1fr 1.3fr 1fr}
.mu{width:100%;display:flex;flex-direction:column;gap:10px}
.mu-figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:320px;margin:0 auto;width:100%}
.mu-fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.mu-fig svg{width:100%;max-width:150px;height:auto;display:block}
.mu-fig figcaption{font-size:11px;color:var(--muted)}
.mu-leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--muted)}
.mu-leg span{display:inline-flex;align-items:baseline;gap:6px}
.mu-dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--accent);flex:0 0 auto}
.mu-dot.soft{background:#ffc7a1}
.mu-txt{font-size:13px;line-height:1.45;color:var(--fg);border-top:1px solid var(--line);padding-top:9px}
.mu-txt b{color:var(--accent);font-weight:600}

/* ---------- Pestañas Entrenar / Historial ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.tab{background:none;border:0;border-radius:9px;padding:9px;font-weight:700;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ok);color:var(--bg);font-weight:700;padding:12px 18px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* ---------- Historial ---------- */
.h-sec{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.h-title{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;margin:0}
.sub{font-size:13px;color:var(--muted);margin:-6px 0 0}
.picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pick{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.pick[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.metric{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.metric button{background:none;border:0;border-radius:8px;padding:7px;font-size:13px;font-weight:700;color:var(--muted)}
.metric button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big strong{font-family:var(--display);font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--bg)}
.delta.up{color:var(--ok)} .delta.down{color:var(--warn)} .delta.same{color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line)}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart .val{fill:var(--fg);font-size:11px;font-weight:700;font-family:var(--body)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row .d{color:var(--muted);font-size:13px}
.row .v{font-weight:700;font-variant-numeric:tabular-nums}
.row .c{font-size:12px;font-weight:700;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.c.up{color:var(--ok)} .c.down{color:var(--warn)} .c.same{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;background:var(--surface);border-radius:14px;padding:18px;text-align:center}
.sess{background:var(--surface);border-radius:14px;overflow:hidden}
.sess summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.sess summary::-webkit-details-marker{display:none}
.sess .s-day{font-weight:700}
.sess .s-date{font-size:13px;color:var(--muted)}
.sess .s-vol{grid-row:1/3;grid-column:2;text-align:right;font-size:12px;color:var(--muted)}
.sess .s-vol b{display:block;font-family:var(--display);font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.sess[open] summary{border-bottom:1px solid var(--line)}
.sess-body{padding:6px 16px 14px;display:flex;flex-direction:column;gap:12px}
.sess-body h4{margin:6px 0 4px;font-family:var(--display);font-size:16px;font-weight:800;text-transform:uppercase}
.sess-body table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.sess-body th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:3px 4px}
.sess-body td{padding:5px 4px;border-top:1px solid var(--line)}
.sess-body td.miss{color:var(--muted)}
.crea-h{background:var(--surface);border-radius:14px;margin-top:18px;overflow:hidden}
.crea-h summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font-size:14px;font-weight:700}
.crea-h summary::-webkit-details-marker{display:none}
.crea-h summary::after{content:"›";color:var(--muted);font-size:18px;transition:transform .2s}
.crea-h[open] summary::after{transform:rotate(90deg)}
.crea-sum{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.crea-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.cm-nav{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.cm-nav button{background:var(--bg);border:0;border-radius:8px;width:30px;height:28px;font-size:16px;color:var(--fg)}
.cm-nav button:disabled{opacity:.3}
.cm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cm-h{font-size:10px;color:var(--muted);font-weight:700}
.cm-d{font-size:11px;padding:5px 0;border-radius:7px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.cm-d.on{background:var(--ok);color:var(--bg);font-weight:800}
.cm-d.fut{opacity:.35}
.cm-d.now{outline:1.5px solid var(--fg);outline-offset:-1.5px}
.crea-note{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.crea-note span{color:var(--accent);font-weight:700;font-size:12px}
.seed-note{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
/* ---------- Inicio ---------- */
.home{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.welcome{background:linear-gradient(135deg,var(--surface-2),var(--surface));border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px}
.welcome .today{font-size:13px;color:var(--muted)}
.welcome h2{margin:0;font-family:var(--display);font-weight:900;font-size:34px;line-height:1;text-transform:uppercase}
.welcome h2 span{color:var(--accent)}
.welcome p{margin:4px 0 0;color:var(--muted);font-size:14px}
.welcome .motto{margin:6px 0 0;color:var(--fg);font-size:15px;font-weight:700;line-height:1.35}
.blk-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 -6px}
.checkin{width:100%;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;transition:border-color .2s,background .2s}
.checkin .box{width:52px;height:52px;border-radius:14px;border:2px solid var(--muted);display:grid;place-items:center;font-size:26px;font-weight:900;color:transparent;transition:all .2s}
.checkin .ci-t{font-weight:700;font-size:16px}
.checkin .ci-s{font-size:13px;color:var(--muted)}
.checkin .ok{font-family:var(--display);font-weight:900;font-size:24px;color:var(--ok);opacity:0;transform:scale(.6);transition:all .25s}
.checkin[aria-pressed="true"]{border-color:var(--ok);background:rgba(74,222,128,.08)}
.checkin[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.checkin[aria-pressed="true"] .ok{opacity:1;transform:none}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:-4px}
.d7{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;background:none;border:0;padding:0;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.week7-hint{font-size:12px;color:var(--muted);margin-top:-2px}
.d7 i{width:100%;max-width:34px;aspect-ratio:1;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--bg);font-weight:900}
.d7.on i{background:var(--ok);border-color:var(--ok)}
.d7.now{color:var(--fg)}
.d7.now i{outline:2px solid var(--fg);outline-offset:1px}
.streak{font-size:13px;color:var(--muted)}
.streak b{color:var(--fg)}
.next{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.next .n-day{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.05}
.next .n-meta{font-size:13px;color:var(--muted)}
.next ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.next li{display:flex;justify-content:space-between;gap:10px}
.vibe{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4;border-left:3px solid var(--accent)}
/* Entreno a medias: aviso al volver a abrir la app */
.resume{background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.resume h3{margin:0;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1.1}
.resume p{margin:0;font-size:14px;line-height:1.4;color:var(--muted)}
.resume p b{color:inherit}
.alt{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.alt-b{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--fg)}
.nolock{font-size:12px;color:var(--muted);text-align:center;margin:0 8px}
.next li span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.setup{margin-top:5px;font-size:12.5px;line-height:1.3;color:#c9cfe8;display:flex;gap:5px;align-items:baseline}
.setup i{font-style:normal;color:var(--accent);font-size:11px}
.setup-w{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.setup-w .setup{margin-top:0}
.setup.mine span{color:var(--fg)}
.setup-ed{background:none;border:0;padding:0 2px;font-size:12px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:2px;flex:0 0 auto}
.setup-orig{font-size:11.5px;color:var(--muted);padding-left:16px}
.setup-add{align-self:flex-start;background:none;border:1px dashed var(--line);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.setup-form{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:8px}
.setup-form input{width:100%;min-width:0;background:var(--surface);border:1.5px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:14px}
.setup-form input:focus{outline:none}
.setup-btns{display:flex;flex-wrap:wrap;gap:6px}
.setup-btns button{border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;border:1px solid var(--line);background:none;color:var(--fg)}
.setup-btns .setup-save{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setup-btns .setup-reset{color:var(--muted);margin-left:auto}
.warm{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
.warm-t{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.35}
.warm-t b{display:block;color:var(--fg);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.warm-ok{flex:0 0 auto;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.warm.cool{margin-top:12px}
.warm-ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.warm.done{border-style:solid;border-color:rgba(74,222,128,.35)}
.paper td{white-space:nowrap}
.paper td.ok{color:#1e8e5e;font-weight:600}
.paper td.lo{color:#c25a12;font-weight:600}
.paper td.hi{color:#b3261e;font-weight:600}
.paper .legend{font-size:10.5px;color:#4a5280}
.ex-note{display:flex;flex-direction:column;gap:6px}
.note-b{align-self:flex-start;background:none;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.ex-note label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ex-note textarea{width:100%;min-height:64px;resize:vertical;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;line-height:1.4}
.ex-note textarea:focus{border-color:var(--accent);outline:none}
.rp-note{margin:2px 0 0;padding:6px 8px;border-left:3px solid #ff8a3d;background:#f3efe7;font-size:11px;line-height:1.4;color:#1a2247;white-space:pre-wrap}
.h-note{margin:4px 0 0;font-size:13px;color:var(--muted);white-space:pre-wrap}
.add-aprox{align-self:flex-start;background:none;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.del-x{margin-left:auto;background:none;border:0;padding:4px 2px;font-size:12px;color:var(--warn);text-decoration:underline;text-underline-offset:2px}
.send-st{margin:0;padding:12px 14px;border-radius:12px;background:#f1efe9;font-weight:700;font-size:15px;text-align:center}
.send-st.ok{background:#e4f3e8;color:#1d6a35}
.send-st.wait{background:#fff3e2;color:#8a5200}
/* Informes por mail (opcional, el cliente lo pone una sola vez) */
.mail-row{display:flex;flex-direction:column;gap:6px}
.mail-b{appearance:none;border:1px dashed #c9c3b5;background:#fff;border-radius:12px;padding:11px 12px;font:600 14px/1.3 var(--body);color:#1a2247;cursor:pointer;text-align:center}
.mail-b u{color:#d96a1c;text-underline-offset:2px}
.mail-st{margin:0;padding:10px 12px;border-radius:12px;background:#eef1fb;color:#1a2247;font-size:13.5px;text-align:center;line-height:1.35;overflow-wrap:anywhere}
.mail-acts{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;align-items:center}
.mail-l{background:none;border:0;padding:4px;font-size:12.5px;color:#55607a;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.mail-f{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:#fff;border:1px solid #e3dfd5}
.mail-f label{font-weight:700;font-size:14px;color:#1a2247}
.mail-f input{font:500 16px var(--body);padding:11px 12px;border-radius:10px;border:1px solid #cfc9bb;background:#fbfaf7;color:#1a2247}
.mail-f .btn{padding:10px 18px}
.mail-err{margin:0;font-size:12.5px;color:#b4381c}
.mail-pp{margin:0;font-size:11.5px;color:#7a7f8c;text-align:center}
.mail-row > .mail-acts .mail-l{color:#d5dbef}
/* Grabarse (como los colores del Excel): verde = grabar top set · naranja = grabar top set y back-off */
.ex.rec-top{box-shadow:inset 5px 0 0 #3ddc84}
.ex.rec-topbo{box-shadow:inset 5px 0 0 var(--accent)}
.rec{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;line-height:1.2}
.rec.top{background:rgba(61,220,132,.15);color:#3ddc84}
.rec.topbo{background:rgba(255,138,61,.16);color:var(--accent)}
.rec-cam{font-size:16px;line-height:1}
.undo{background:none;border:0;padding:6px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.side{background:none;border:0;border-radius:8px;padding:7px 4px;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.side small{font-size:11px;font-weight:600;min-height:13px;font-variant-numeric:tabular-nums}
.side[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.side[aria-pressed="true"] small{color:var(--accent)}
.sheet-in>*{flex-shrink:0}
.fb{background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fb-h{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1.1}
.fb-r{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center}
.fb-i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:14px;background:var(--surface-2);color:var(--muted)}
.fb-t{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.fb-t b{font-size:13.5px;font-weight:700}
.fb-t small{font-size:12px;color:var(--muted)}
.fb-b{font-size:12px;font-weight:800;padding:4px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;max-width:120px}
.fb-r.up .fb-i{background:var(--ok);color:var(--bg)} .fb-r.up .fb-b{color:var(--ok);background:rgba(74,222,128,.12)}
.fb-r.new .fb-i{background:var(--accent);color:var(--accent-ink)} .fb-r.new .fb-b{color:var(--accent)}
.fb-r.mid .fb-i{background:rgba(255,178,122,.18);color:var(--warn)} .fb-r.mid .fb-b{color:var(--warn)}
.fb-f{margin:0;font-size:11px;color:var(--muted);text-align:right}
.imp-note{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
/* ---------- Informe de sesión (PDF) ---------- */
.sheet .paper{background:#fbfaf7;color:#1a2247;border-radius:12px;padding:0;gap:0;max-height:52vh;overflow:auto;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.rp-band{background:#1a2247;color:#fff;padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:4px solid #ff8a3d}
.rp-logo{font-family:var(--display);font-weight:900;font-size:24px;line-height:.9;text-transform:uppercase;letter-spacing:.01em}
.rp-logo span{color:#ff8a3d}
.rp-logo small{display:block;font-family:var(--body);font-size:9px;font-weight:600;letter-spacing:.16em;color:#aab2d8;margin-top:5px}
.rp-who{text-align:right;min-width:0}
.rp-who b{display:block;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1}
.rp-who span{display:block;font-size:10.5px;color:#c9cfe8;margin-top:3px}
.rp-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.congrats{background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:900;font-size:22px;line-height:1.05;text-transform:uppercase;text-align:center;padding:14px 12px;border-radius:14px}
.rp-congrats{background:#ff8a3d;color:#1a2247;font-family:var(--display);font-weight:900;font-size:17px;line-height:1.1;text-transform:uppercase;text-align:center;padding:10px;border-radius:8px}
.rp-stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #e2e4ee;border-radius:10px;overflow:hidden}
.rp-stat{padding:8px 10px;border-left:1px solid #e2e4ee;min-width:0}
.rp-stat:first-child{border-left:0}
.rp-stat small{display:block;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#6a7199;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-stat strong{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;color:#1a2247}
.rp-stat strong.ok{color:#1e8e5e}
.rp-prog{display:flex;flex-direction:column;gap:5px}
.rp-h{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#6a7199;font-weight:800}
.rp-pr{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11.5px;padding:5px 8px;background:#f1f0ea;border-radius:7px}
.rp-pr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rp-pr em{font-style:normal;font-weight:800;font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rp-pr.up em{color:#1e8e5e} .rp-pr.new em{color:#d4651a} .rp-pr.mid em{color:#c25a12} .rp-pr.same em{color:#6a7199}
.rp-ex{display:flex;flex-direction:column;gap:6px}
.rp-ex-h{display:flex;align-items:baseline;gap:8px;border-bottom:1.5px solid #1a2247;padding-bottom:4px}
.rp-n{font-family:var(--display);font-weight:900;font-size:13px;color:#ff8a3d}
.rp-ex-h h3{margin:0;font-family:var(--display);font-weight:800;font-size:16px;line-height:1.05;text-transform:uppercase;color:#1a2247}
.rp-setup{font-size:10.5px;color:#4a5280;background:#fff4ec;border-radius:6px;padding:4px 7px}
.rp-setup b{color:#c25a12;font-weight:700}
.paper table{color:#1a2247;width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th{text-align:left;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#6a7199;font-weight:700;padding:2px 4px;border:0}
.paper td{padding:5px 4px;border-top:1px solid #eceef5;border-bottom:0;color:#1a2247;font-weight:600;white-space:nowrap;font-size:12px}
.paper td.miss{color:#b4b8cf;font-weight:500}
.paper th.r,.paper td.r{text-align:right}
.rp-t{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid currentColor}
.rp-t.aprox{color:#8a90ad}
.rp-t.top{color:#fff;background:#ff8a3d;border-color:#ff8a3d}
.rp-t.bo{color:#3b5fc4}
.rp-t.bo2{color:#6b4fc4}
.rp-pill{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px}
.rp-pill.ok{background:#e3f5ec;color:#1e8e5e}
.rp-pill.lo{background:#fff0e3;color:#c25a12}
.rp-pill.hi{background:#fde8e6;color:#b3261e}
.paper tr.skip td{color:#b4b8cf;font-weight:500}
.rp-foot{border-top:1px solid #e2e4ee;padding-top:8px;font-size:9.5px;color:#6a7199;line-height:1.45;display:flex;flex-direction:column;gap:4px}
.rp-foot b{color:#1a2247}
.imgview{position:fixed;inset:0;z-index:40;background:rgba(6,9,26,.94);display:flex;flex-direction:column;align-items:center;gap:12px;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.imgview p{margin:0;max-width:420px;text-align:center;font-size:14px;color:var(--fg);line-height:1.4}
.imgview p b{color:var(--accent)}
.imgview img{width:100%;max-width:420px;border-radius:10px;display:block;-webkit-touch-callout:default;user-select:auto}
.imgview .ghost{width:100%;max-width:420px;flex-shrink:0}
.s-rep{width:100%;margin-top:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:800}
.s-del{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.s-del-b{background:none;border:1px solid rgba(255,178,122,.4);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--warn)}
.s-del-q{flex:1 1 100%;margin:0;font-size:13px;color:var(--fg)}
.s-del-yes{background:#e5534b;border:0;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:800;color:#fff}
.s-del-no{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Opción A / B */
.opt{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:-2px 0 12px}
.opt.three{grid-template-columns:1fr 1fr 1fr}
.opt-b{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:8px 6px;font:700 13px/1.15 var(--body);cursor:pointer}
.opt-b small{display:block;font-weight:500;font-size:10.5px;opacity:.8;margin-top:2px}
.opt-b[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1a1205}
.opt-none{font-size:11.5px;color:var(--muted);margin:-2px 0 10px;letter-spacing:.01em}
.ex.is-b .ex-name::after{content:"Opción B"}
.ex.is-c .ex-name::after{content:"Opción C"}
.ex.is-b .ex-name::after,.ex.is-c .ex-name::after{display:inline-block;margin-left:8px;font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:3px 5px;vertical-align:middle}
.next li span{white-space:nowrap}
.has-b{font-style:normal;font-size:10px;font-weight:700;color:var(--accent);margin-left:4px}
.rp-opt{font-style:normal;font-size:10px;color:#ff8a3d;text-transform:uppercase;letter-spacing:.06em}
.scale .lab small{font-weight:500;text-transform:none;letter-spacing:0}
.brand{font-size:clamp(44px,15vw,60px)}
/* Informe compacto (v2) */
.paper.rq{font-size:13px}
.rq .rp-band{padding:14px 16px 12px;border-bottom:0}
.rq .rp-who b{font-size:24px}
.rq .rq-day{font-size:13px!important;color:#fff!important;font-weight:700;margin-top:4px!important}
.rq-dates{background:#ff8a3d;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rq-chip{font-size:12.5px;color:#1a2247;font-weight:600;background:#fff;border-radius:999px;padding:3px 10px;white-space:nowrap}
.rq-chip b{font-weight:900}
.rq-chip.dim{background:rgba(255,255,255,.55)}
.rq .rp-body{gap:12px;padding:12px 14px 14px}
.rq-congrats{font-family:var(--display);font-weight:900;font-size:15px;line-height:1.15;text-transform:uppercase;text-align:center;color:#1a2247}
.rq-stats{display:flex;border:1px solid #e2e4ee;border-radius:10px;overflow:hidden}
.rq-stats>div{flex:1;padding:6px 10px;border-left:1px solid #e2e4ee;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.rq-stats>div:first-child{border-left:0}
.rq-stats small{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#6a7199;font-weight:800}
.rq-stats strong{font-family:var(--display);font-weight:800;font-size:17px;color:#1a2247;font-variant-numeric:tabular-nums;white-space:nowrap}
.rq-stats strong.ok{color:#1e8e5e}
.rq-ex{background:#fff;border:1px solid #e6e3da;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}

<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>

<script>
/* ---------- Datos de ejemplo (en la app real vendrán del servidor) ---------- */
/* ---------- Clientes ----------
   Cada ejercicio tiene su opción A y, si existe, su opción B (alt) por si la máquina está ocupada.
   La opción B hereda el vídeo de la A (mismo patrón de movimiento) salvo que se indique otro.
   prev = lo que hizo la semana anterior (kg×reps). img = foto de la máquina (carpeta fotos/). */
/* Las rutinas ya no van aquí: están en la hoja de Google de Cristian (pestaña Rutinas)
   y la app pide solo la del código que se mete. */
const CLIENTS = {};
/* Fotos de tus bibliotecas de máquinas */
const PHOTOS = {};
const TYPE_LABEL = {aprox:"Aproximación", top:"Top set", bo:"Back-off", bo2:"Back-off 2", ok:"Hecho"};
const RIR = ["0","1","2","+2"];
/* RIR objetivo: lo pautás vos (en el objetivo de la serie o por ejercicio) */
function tRir(ex, s){
  if (s.type === "aprox" || s.type === "ok" || ex.check) return null;
  if (s.rir != null) return String(s.rir);
  const m = String(s.target).match(/RIR\s*(\+?\d)/);
  return m ? m[1] : (ex.rir != null ? String(ex.rir) : null);
}
function targetTxt(ex, s){
  const r = tRir(ex, s);
  return s.target;
}
/* RPE que marca el atleta -> RIR aproximado (RPE 9 ≈ RIR 1) y comparación con lo pautado */
function rpeRead(rpe, tr){
  if (rpe == null || rpe === "") return null;
  const est = 10 - +rpe, estTxt = est >= 4 ? "4+" : String(est);
  const q = est === 0 ? "fallo" : `~${estTxt}`;
  if (tr == null) return { txt:q, cls:"" };
  const t = tr === "+2" ? 3 : +tr, d = est - t;
  return d >= 2 ? { txt:`${q} suave`, cls:"lo" }
       : d < 0  ? { txt:`${q} pasado`, cls:"hi" }
       :          { txt:`${q} ✓`, cls:"ok" };
}

/* ---------- Opción A / B ----------
   Si la máquina está ocupada, el atleta cambia a la opción B: mismo patrón de movimiento, mismo orden.
   Cada opción guarda sus series por separado y su "última vez" sale de su propio historial. */
/* Opción C (alt2): tercera opción si A y B están ocupadas */
function optOf(day, ei){ const ex = day.exercises[ei], o = log[`${day.id}-${ei}-opt`]; return ex.alt2 && o === "C" ? "C" : ex.alt && o === "B" ? "B" : "A"; }
function eff(day, ei){
  const ex = day.exercises[ei];
  const o = optOf(day, ei);
  if (o === "A") return { ...ex, opt: ex.alt || ex.alt2 ? "A" : null };
  const x = o === "C" ? ex.alt2 : ex.alt;
  return { ...ex, ...x, cues: x.cues || ex.cues, memo: x.memo || ex.memo, alt: undefined, alt2: undefined, opt: o };
}
const exs = day => day.exercises.map((_, ei) => eff(day, ei));
const sfx = (day, ei) => ({ B:"b", C:"c" })[optOf(day, ei)] || "";

/* ---------- Estado ---------- */
let code = null, dayIdx = 0, log = {}, fails = 0, lockUntil = 0, mySetup = {};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
/* ---------- Conexión con la hoja de Cristian: rutinas y copia de seguridad ----------
   La rutina de cada cliente vive en la hoja de Google de Cristian (no en este archivo).
   La app pide solo la del código que se mete, la guarda en el móvil para funcionar sin
   internet, y sube cada entreno a la hoja para poder recuperarlo si se cambia de móvil. */
const API = "https://script.google.com/macros/s/AKfycbwiiqxwd2ORCzOD5aSvdamxt6IWDzKbkrktzblpq2RgUkL6HIbrH8qUGug8kbK4cIFY/exec", APP_ID = "CristianEntrenador", P = "ce";
async function api(body){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ app: APP_ID }, body)), signal: ctl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}
const sid = e => String(e.id || e.ts);
/* Opción C por defecto en VivaGym: a toda "Extensión de cuádriceps (unilateral) con respaldo" con opción B
   y sin opción C se le añade la máquina de femoral (sin setup: cada cliente apunta el suyo) */
function withDefaults(cl){
  (cl && cl.days || []).forEach(d => (d.exercises || []).forEach(ex => {
    const m = /^Extensión de cuádriceps (unilateral )?con respaldo$/.exec(ex.name || "");
    if (!m || !ex.alt || ex.alt2) return;
    ex.alt2 = { name: `Extensión de cuádriceps ${m[1] || ""}máquina de femoral`, img: "fotos/curl-femoral-respaldo.jpg", setup: null,
      sets: ex.alt.sets.map(s => ({ type: s.type, target: s.target })) };
  }));
  return cl;
}
function loadCached(c){ const cl = store.get(P + "-client-" + c); if (cl && cl.days) CLIENTS[c] = withDefaults(cl); return !!CLIENTS[c]; }
function cacheClient(c, cl){ CLIENTS[c] = withDefaults(cl); store.set(P + "-client-" + c, cl); }
/* Junta la copia de la hoja con lo que ya hay en el móvil, sin borrar nada del móvil */
function mergeBackup(c, b){
  if (!b) return;
  let h = store.get(P + "-hist-" + c);
  if (!Array.isArray(h)){ h = seedHistory(c); store.set(P + "-seedver-" + c, seedVerOf(c)); }
  const have = new Set(h.map(sid)), dels = new Set(store.get(P + "-deleted-" + c) || []);
  const synced = new Set(store.get(P + "-synced-" + c) || []);
  (b.sessions || []).forEach(e => { const id = sid(e); synced.add(id); if (!have.has(id) && !dels.has(id)) h.push(e); });
  h.sort((a,b) => a.ts - b.ts);
  store.set(P + "-hist-" + c, h); store.set(P + "-synced-" + c, [...synced]);
  const k = b.keys || {};
  if (k.crea) store.set(P + "-crea-" + c, Object.assign({}, k.crea, store.get(P + "-crea-" + c) || {}));
  if (k.setup) store.set(P + "-setup-" + c, Object.assign({}, k.setup, store.get(P + "-setup-" + c) || {}));
  if (typeof k.mail === "string" && store.get(P + "-mail-" + c) == null) store.set(P + "-mail-" + c, k.mail);
}
/* Pide la rutina a la hoja. true = existe, false = ese código no existe; lanza error si no hay conexión */
async function fetchClient(c, withBackup){
  const r = await api({ action: "login", code: c, withBackup: !!withBackup });
  if (!r || !r.ok){ if (r && r.error === "no-existe") return false; throw new Error("api"); }
  store.set(P + "-mailon", !!r.mailOn);
  cacheClient(c, r.client);
  if (withBackup) mergeBackup(c, r.backup);
  return true;
}
/* Al abrir: si Cristian cambió la rutina en la hoja, se actualiza (si está entrenando, espera a la próxima vez) */
async function refreshClient(c){
  try {
    const before = JSON.stringify(CLIENTS[c] || null);
    /* También trae la copia de la hoja: si el móvil perdió entrenos (otra ventana, Safari vs. app instalada,
       iPhone que borró datos…), los recupera solos al abrir */
    const r = await api({ action: "login", code: c, withBackup: true });
    if (!r || !r.ok || !r.client) return;
    withDefaults(r.client);
    store.set(P + "-mailon", !!r.mailOn);
    const n0 = (store.get(P + "-hist-" + c) || []).length;
    mergeBackup(c, r.backup);
    const gotBack = (store.get(P + "-hist-" + c) || []).length > n0;
    const changed = JSON.stringify(r.client) !== before;
    if (!changed && !gotBack) return;
    if (changed) store.set(P + "-client-" + c, r.client);
    if (code === c && view !== "train"){ CLIENTS[c] = r.client; login(c); }
  } catch(e){}
}
/* Copia de seguridad: sube los entrenos nuevos, los borrados, la creatina y los ajustes de máquinas */
let syncT = 0, syncing = false;
function queueSync(ms){ clearTimeout(syncT); syncT = setTimeout(syncNow, ms == null ? 1500 : ms); }
function markKeys(){ if (code){ store.set(P + "-keysdirty-" + code, Date.now()); queueSync(); } }
async function syncNow(){
  if (!code || syncing) return;
  const c = code, synced = new Set(store.get(P + "-synced-" + c) || []);
  const deleted = store.get(P + "-deleted-" + c) || [];
  const pend = (store.get(P + "-hist-" + c) || []).filter(e => !e.seed && !e.imported && !synced.has(sid(e))).slice(0, 15);
  const dirty = store.get(P + "-keysdirty-" + c);
  if (!pend.length && !deleted.length && !dirty) return;
  syncing = true;
  try {
    const keys = dirty ? { crea: store.get(P + "-crea-" + c) || {}, setup: store.get(P + "-setup-" + c) || {}, ...(store.get(P + "-mail-" + c) != null ? { mail: store.get(P + "-mail-" + c) } : {}) } : {};
    const r = await api({ action: "save", code: c, sessions: pend, deleted, keys });
    if (r && r.ok){
      const s2 = new Set(store.get(P + "-synced-" + c) || []); pend.forEach(e => s2.add(sid(e)));
      store.set(P + "-synced-" + c, [...s2]);
      store.set(P + "-deleted-" + c, (store.get(P + "-deleted-" + c) || []).filter(x => !deleted.includes(x)));
      if (store.get(P + "-keysdirty-" + c) === dirty) store.del(P + "-keysdirty-" + c);
      syncing = false; queueSync(300); // por si queda algo más
    }
  } catch(e){} finally { syncing = false; }
}
/* Si se borra una sesión que ya estaba en la hoja, se apunta para borrarla también allí */
function trackDeleted(){
  if (!code) return;
  const synced = store.get(P + "-synced-" + code) || []; if (!synced.length) return;
  const ids = new Set(hist.map(sid)), gone = synced.filter(id => !ids.has(id));
  if (!gone.length) return;
  store.set(P + "-synced-" + code, synced.filter(id => ids.has(id)));
  store.set(P + "-deleted-" + code, [...new Set((store.get(P + "-deleted-" + code) || []).concat(gone))]);
}
window.addEventListener("online", () => queueSync(500));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") queueSync(800); });
/* ---------- Informe a la carpeta de Drive de Cristian (sin compartir nada a mano) ----------
   Al terminar, la imagen del informe se sube sola. Si no hay internet en el gimnasio,
   se guarda en el móvil y se manda sola en cuanto vuelva la conexión. */
/* "photosent2": antes dos sesiones del mismo día se llamaban igual y la segunda no llegaba a Drive */
/* Mail del cliente para recibir sus informes: opcional, lo pone una sola vez (se guarda en el móvil y en la hoja).
   Solo se muestra si la hoja ya sabe mandar mails (mailOn llega al entrar) */
const mailKey = c => P + "-mail-" + c;
const getMail = () => code ? (store.get(mailKey(code)) || "") : "";
const okMail = m => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m);
function setMail(m){ store.set(mailKey(code), m || ""); markKeys(); }
const mailOn = () => !!store.get(P + "-mailon");
const sentKey = c => P + "-photosent2-" + c;
const photoSent = e => code && (store.get(sentKey(code)) || []).includes(sid(e));
function markPhotoSent(c, id){ const s = store.get(sentKey(c)) || []; if (!s.includes(id)){ s.push(id); store.set(sentKey(c), s.slice(-200)); } }
function reportJpeg(canvas){
  /* Más ligera para subirla rápido: máximo 1000 px de ancho */
  const k = Math.min(1, 1000 / canvas.width);
  let cv = canvas;
  if (k < 1){ cv = document.createElement("canvas"); cv.width = Math.round(canvas.width * k); cv.height = Math.round(canvas.height * k);
    const g = cv.getContext("2d"); g.fillStyle = "#fbfaf7"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(canvas, 0, 0, cv.width, cv.height); }
  return cv.toDataURL("image/jpeg", 0.85).split(",")[1];
}
async function postPhoto(it){
  try { const r = await api({ action: "photo", code: it.code, id: it.id, name: it.name, data: it.data, mail: it.mail || undefined }); return !!(r && r.ok); }
  catch(e){ return false; }
}
/* true = le llegó a Cristian; false = queda en cola y se manda sola más tarde */
async function sendReport(e, canvas, base){
  const it = { code, id: sid(e), name: base + ".jpg", data: reportJpeg(canvas), mail: (mailOn() && getMail()) || undefined };
  if (await postPhoto(it)){ markPhotoSent(it.code, it.id); return true; }
  const q = (store.get(P + "-photoq") || []).filter(x => x.id !== it.id); q.push(it);
  while (q.length > 4) q.shift();
  store.set(P + "-photoq", q);
  return false;
}
let flushing = false;
async function flushPhotos(){
  const q = store.get(P + "-photoq") || [];
  if (!q.length || flushing || !navigator.onLine) return;
  flushing = true;
  try {
    for (const it of q){
      if (!(await postPhoto(it))) break;
      markPhotoSent(it.code, it.id);
      store.set(P + "-photoq", (store.get(P + "-photoq") || []).filter(x => x.id !== it.id));
    }
  } finally { flushing = false; }
}
window.addEventListener("online", () => setTimeout(flushPhotos, 1500));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") setTimeout(flushPhotos, 2000); });
setTimeout(flushPhotos, 4000);
/* Pinta el estado del envío en el resumen y deja "Compartir" solo como opción extra */
async function autoSend(sh, e, rep, base, who){
  const st = sh.querySelector("#send-st"), imgBtn = sh.querySelector("#img");
  imgBtn.className = "ghost"; imgBtn.hidden = false; imgBtn.textContent = "📤 Compartir también por WhatsApp (opcional)";
  if (photoSent(e)){ st.className = "send-st ok"; st.textContent = `✓ Este informe ya le llegó a ${who}`; return; }
  st.className = "send-st"; st.textContent = `Enviando el informe a ${who}…`;
  let ok = false;
  try { ok = await sendReport(e, rep.canvas, base); } catch(err){}
  st.className = "send-st " + (ok ? "ok" : "wait");
  if (!ok){
    imgBtn.className = "btn"; imgBtn.textContent = `📤 Plan B: mandársela a ${who} por WhatsApp`;
    const alt = sh.querySelector("#imgalt"); if (alt) alt.hidden = false;
  }
  st.textContent = ok ? `✓ Tranqui, ${who} ya tiene guardado tu informe. Ahora toca descansar y comer bien, del resto se encarga Cris 💪`
    : `No se pudo enviar ahora. Se volverá a intentar sola, pero para asegurarte usa el plan B de aquí abajo 👇`;
}
/* Primera vez con esta versión: el cliente ya tenía su código guardado pero no su rutina */
function renderLoading(c){
  app.innerHTML = `<section class="login"><div><div class="brand">Cristian<br><span>Entrenador</span></div>
    <p class="brand-sub" id="ld-msg">Cargando tu rutina…</p></div>
    <button class="btn" id="ld-retry" hidden>Reintentar</button>
    <button class="ghost" id="ld-out" hidden>Entrar con otro código</button></section>`;
  const m = document.getElementById("ld-msg"), rb = document.getElementById("ld-retry"), ob = document.getElementById("ld-out");
  rb.onclick = () => renderLoading(c);
  ob.onclick = () => { store.del(P + "-code"); renderLogin(); };
  fetchClient(c, false).then(ok => { if (ok) login(c); else { store.del(P + "-code"); renderLogin(); } })
    .catch(() => { m.textContent = "Necesitas internet para cargar tu rutina esta vez. Conéctate y dale a reintentar."; rb.hidden = false; ob.hidden = false; });
}
const norm = s => (s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Pantalla de acceso ---------- */
function renderLogin(){
  app.innerHTML = `
  <section class="login">
    <div>
      <div class="brand">Cristian<br><span>Entrenador</span></div>
      <p class="brand-sub">Tu rutina, tus series y tus pesos. Solo entra y entrena.</p>
    </div>
    <form class="code-box" id="f">
      <label for="code">Tu código de 6 números</label>
      <input id="code" autocomplete="off" inputmode="numeric" pattern="[0-9]*" spellcheck="false" maxlength="6" placeholder="000000">
      <button class="btn" id="go" type="submit">Entrar</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
    <p class="demo-hint">Escribe el código que te pasó Cristian.</p>
  </section>`;
  const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
  f.addEventListener("submit", e => {
    e.preventDefault();
    if (Date.now() < lockUntil){ return; }
    const c = norm(document.getElementById("code").value);
    if (loadCached(c)){ fails = 0; login(c); refreshClient(c); return; }
    go.disabled = true; msg.textContent = "Buscando tu rutina…";
    fetchClient(c, true).then(ok => {
      go.disabled = false;
      if (ok){ fails = 0; msg.textContent = ""; login(c); } else bad();
    }).catch(() => { go.disabled = false; msg.textContent = "No hay conexión. La primera vez necesitas internet para cargar tu rutina."; });
  });
  function bad(){
    fails++;
    if (fails >= 5){
      lockUntil = Date.now() + 30000; go.disabled = true;
      msg.textContent = "Demasiados intentos. Espera 30 segundos.";
      setTimeout(() => { go.disabled = false; fails = 0; msg.textContent = ""; }, 30000);
    } else {
      msg.textContent = `Ese código no existe. Te quedan ${5 - fails} intentos.`;
    }
  }
}

/* Máquinas que cambiaron de nombre: los entrenos viejos pasan al nombre nuevo,
   así no se pierde la "última vez" ni la gráfica de progreso de ese ejercicio */
const RENAMED = {
  "Press plano en máquina de placas (al lado de los aductores)": "Press plano en máquina de placas (al lado de prensa horizontal)"
};
function applyRenames(h){
  let n = 0;
  (h || []).forEach(e => {
    (e.exercises || []).forEach(x => { if (RENAMED[x.name]){ x.name = RENAMED[x.name]; n++; } });
    (e.fb || []).forEach(x => { if (RENAMED[x.name]){ x.name = RENAMED[x.name]; n++; } });
  });
  return n;
}
/* Corrección de una serie mal apuntada: Cristian la pone en la rutina (histFix) y se aplica una sola vez
   en el historial del móvil. Ej.: [{ id:"f1", s:"<id sesión>", ex:"<ejercicio>", set:1, kg:"39" }] (set empieza en 0)
   o [{ id:"f2", s:"<id sesión>", ex:"<ejercicio>", repl:{ name, opt, sets:[...] } }] para cambiar el ejercicio entero */
function fixHist(c, h){
  const cl = CLIENTS[c], fx = cl && cl.histFix; if (!Array.isArray(fx) || !fx.length) return 0;
  const done = new Set(store.get(P + "-histfix-" + c) || []); let n = 0;
  fx.forEach(f => {
    if (!f || !f.id || done.has(f.id)) return;
    const e = (h || []).find(x => sid(x) === String(f.s)), x = e && (e.exercises || []).find(y => y.name === f.ex);
    if (f.repl && !e) return; /* esa sesión aún no está en el móvil (se recupera de la hoja): se aplica cuando llegue */
    /* repl: sustituye el ejercicio entero de esa sesión (nombre, opción y series), ej. si se apuntó en otra opción */
    if (x && f.repl && Array.isArray(f.repl.sets)){
      x.name = f.repl.name || x.name; if (f.repl.opt) x.opt = f.repl.opt; else delete x.opt;
      x.sets = f.repl.sets.map(z => ({ ...z })); delete e.fb; n++; done.add(f.id); return;
    }
    const st = x && x.sets && x.sets[f.set];
    if (st){ if (f.kg != null) st.kg = String(f.kg); if (f.reps != null) st.reps = String(f.reps); n++; }
    done.add(f.id);
  });
  store.set(P + "-histfix-" + c, [...done]);
  return n;
}
/* Versión de la "última vez" cargada: cambia sola si Cristian cambia la rutina (ejercicios o datos de la semana anterior) */
function seedVerOf(c){
  const cl0 = CLIENTS[c], fp = JSON.stringify([cl0.lastWeek || "", cl0.fresh ? 1 : 0, (cl0.days || []).map(d => [d.id, d.lastWeek || "", d.exercises.map(x => [x.name, x.sets.map(s => s.prev || ""), x.alt ? [x.alt.name, x.alt.sets.map(s => s.prev || "")] : 0].concat(x.alt2 ? [[x.alt2.name]] : []))])]);
  let h = 0; for (let i = 0; i < fp.length; i++) h = (h * 31 + fp.charCodeAt(i)) | 0;
  return (cl0.seedVer || 0) + ":" + h;
}
/* Al recargar la semana del Excel, va siempre antes que los entrenos reales (para no tapar la última vez real) */
function reseed(c, h){
  const real = h.filter(e => !e.seed && !e.imported), seed = seedHistory(c);
  if (real.length && seed.length){
    const first = Math.min(...real.map(e => e.ts)), shift = Math.max(...seed.map(e => e.ts)) - first + 864e5;
    if (shift > 0) seed.forEach(e => e.ts -= shift);
  }
  return real.concat(seed).sort((a,b) => a.ts - b.ts);
}
function login(c){
  code = c; store.set("ce-code", c);
  if (!store.get(P + "-synced-" + c)){ store.set(P + "-synced-" + c, []); store.set(P + "-keysdirty-" + c, Date.now()); }
  queueSync(2500);
  log = store.get("ce-log-" + c) || {};
  hist = store.get("ce-hist-" + c);
  const ver = seedVerOf(c);
  if (!Array.isArray(hist)) { hist = seedHistory(c); saveHist(); store.set("ce-seedver-" + c, ver); }
  else if ((store.get("ce-seedver-" + c) || 0) !== ver){
    hist = reseed(c, hist);
    saveHist(); store.set("ce-seedver-" + c, ver);
  }
  if (applyRenames(hist)) store.set("ce-hist-" + c, hist);
  if (fixHist(c, hist)) store.set("ce-hist-" + c, hist);
  mySetup = fixSetups(c, store.get("ce-setup-" + c) || {});
  crea = store.get("ce-crea-" + c) || {}; creaMonth = 0; creaOpen = false;
  /* Si Android cerró la página al bloquear el móvil, vuelve a la misma pantalla, día y posición */
  const pos = store.get("ce-pos-" + c);
  const fresh = pos && Date.now() - (pos.ts || 0) < 6 * 3600 * 1000;
  view = fresh && ["home","train","hist"].includes(pos.view) ? pos.view : "home";
  dayIdx = fresh && CLIENTS[c].days[pos.day] ? pos.day : 0;
  render();
  if (fresh && pos.y) requestAnimationFrame(() => window.scrollTo(0, pos.y));
}

function logout(){ if (code) store.del("ce-pos-" + code); store.del("ce-code"); code = null; renderLogin(); }
function save(){ store.set("ce-log-" + code, log); store.set("ce-logts-" + code, Date.now()); }
/* Entreno a medias: un día con series marcadas o con kilos/reps apuntados que todavía no se terminó */
function pendingDay(){
  const cl = CLIENTS[code]; let best = null;
  cl.days.forEach((day, i) => {
    let total = 0, done = 0, any = false;
    exs(day).forEach((ex, ei) => setsOf(day, ex, ei).forEach(o => {
      const v = log[o.k] || {}; total++;
      if (v.done) done++;
      if (v.done || [v.kg, v.reps, v.kgL, v.repsL].some(x => x != null && String(x).trim() !== "")) any = true;
    }));
    if (any && (!best || done > best.done)) best = { i, day, done, total };
  });
  return best;
}
function clearDay(day){ Object.keys(log).filter(k => k.startsWith(day.id + "-")).forEach(k => delete log[k]); save(); }

/* ---------- Historial: utilidades ---------- */
const parsePrev = p => { const t = String(p).replace(",", "."), m = t.match(/([\d.]+)\s*×\s*(\d+)/); if (m) return {kg:+m[1], reps:+m[2], ok:true};
  const r = t.trim().match(/^(\d+)$/); return r ? {kg:0, reps:+r[1], ok:true} : {kg:0, reps:0, ok:false}; };
/* Abdominales a peso corporal: crunch sin "máquina" en el nombre, con ruedita, en paralelas o elevación de piernas → solo reps, sin kilos */
const repsOnly = ex => !!ex && ((/crunch/i.test(ex.name || "") && !/m[aá]quina/i.test(ex.name || "")) || /ruedita|paralelas|elevaci[oó]n de piernas/i.test(ex.name || ""));
const fmt = n => (+n).toLocaleString("es-ES", {maximumFractionDigits:1});
const n0 = v => parseFloat(v) || 0;

/* Sesiones de ejemplo para que el prototipo tenga datos (la app real usará las del cliente) */
function seedHistory(c){
  const cl = CLIENTS[c], out = [], WEEKS = 5, now = new Date();
  /* Atleta nuevo, sin semana anterior: empieza con el historial vacío */
  if (cl.fresh) return out;
  if (cl.lastWeek){
    /* Semana anterior real, cargada desde el Excel de Cristian: una sesión por día */
    cl.days.forEach((day, di) => {
      const wk = day.lastWeek || cl.lastWeek;
      const d = new Date(now); d.setDate(d.getDate() - (cl.days.length - di) * 2 - (wk !== cl.lastWeek ? 7 : 0)); d.setHours(18,30,0,0);
      out.push({ id:`imp-${day.id}-${cl.seedVer||0}`, ts:d.getTime(), dayId:day.id, dayLabel:day.label, imported:true, week:wk,
        /* Si la semana pasada hizo la opción B (prev cargado en la B), el registro va a nombre de la B */
        exercises: day.exercises.map(ex0 => ex0.alt && ex0.alt.sets.some(s => s.prev) && !ex0.sets.some(s => s.prev) ? { ...ex0, ...ex0.alt } : ex0).map(ex => ({ name: ex.name, check: ex.check || undefined, sets: ex.sets.map(s => {
          const [pr, pl] = String(s.prev || "").split("|"), p = parsePrev(pr), q = ex.uni ? parsePrev(pl || pr) : null;
          return { type:s.type, kg:p.ok && !repsOnly(ex) ? String(p.kg) : "", reps:p.ok ? String(p.reps) : "", ...(q ? { kgL:q.kg ? String(q.kg) : "", repsL:q.reps ? String(q.reps) : "" } : {}),
            rpe:null, rir:null, tRir:tRir(ex, s), done:p.ok };
        })}))
      });
    });
    return out.sort((a,b) => a.ts - b.ts);
  }
  cl.days.forEach((day, di) => {
    for (let w = WEEKS; w >= 1; w--){
      const d = new Date(now); d.setDate(d.getDate() - w*7 + di*3 - 3); d.setHours(18,30,0,0);
      const back = w - 1; // la más reciente coincide con "Última"
      out.push({ id: `seed-${day.id}-${w}`, ts: d.getTime(), dayId: day.id, dayLabel: day.label, seed: true,
        exercises: day.exercises.map(ex => ({ name: ex.name, sets: ex.sets.map(s => {
          const p = parsePrev(s.prev), inc = p.kg >= 40 ? 2.5 : 1;
          const kg = Math.max(0, p.kg - inc * Math.ceil(back * 0.75));
          const reps = Math.max(1, p.reps - (back % 2));
          return { type: s.type, kg: String(kg), reps: String(reps), rpe: s.type === "aprox" ? null : 8, rir: s.type === "aprox" ? null : (s.type === "top" ? "1" : "2"), done: true };
        })}))
      });
    }
  });
  return out.sort((a,b) => a.ts - b.ts);
}
/* Volumen de una serie: en unilaterales suma brazo derecho + izquierdo */
const setVol = v => n0(v.kg) * (parseInt(v.reps)||0) + n0(v.kgL) * (parseInt(v.repsL)||0);
const hasVal = x => x != null && x !== "";
/* Texto kg × reps; en unilaterales "D 12,5×10 · I 12,5×11" */
function kgx(v, uni){
  const one = (kg, r) => !(hasVal(kg) && +kg) && hasVal(r) ? `${r} reps` : `${hasVal(kg) ? fmt(+kg) : "—"} kg × ${hasVal(r) ? r : "—"}`;
  if (!uni || (v.kgL === undefined && v.repsL === undefined)) return one(v.kg, v.reps);
  return `D ${one(v.kg, v.reps)} · I ${one(v.kgL, v.repsL)}`;
}
function entryVol(e){
  return e.exercises.reduce((a,ex) => a + ex.sets.filter(s => s.done && s.type !== "aprox").reduce((b,s) => b + setVol(s), 0), 0);
}
/* "Última" sale del historial real si existe; si no, del dato de ejemplo */
/* Series del ejercicio: las pautadas + las aproximaciones que añade el atleta (van detrás de las pautadas) */
function setsOf(day, ex, ei){
  const nX = +log[`${day.id}-${ei}${sfx(day, ei)}-xn`] || 0, out = [], cnt = {};
  const push = (s, k, extra, xi) => { cnt[s.type] = (cnt[s.type] || 0) + 1; out.push({ s, k, extra, xi, ord: cnt[s.type] - 1 }); };
  let lastA = -1; ex.sets.forEach((s,i) => { if (s.type === "aprox") lastA = i; });
  const addX = () => { for (let x = 0; x < nX; x++) push({ type:"aprox", target:"Extra" }, `${day.id}-${ei}${sfx(day, ei)}-x${x}`, true, x); };
  if (lastA < 0) addX();
  ex.sets.forEach((s,si) => { push(s, setKey(day.id, ei + sfx(day, ei), si), false); if (si === lastA) addX(); });
  return out;
}
/* "Última vez": misma serie (mismo tipo y mismo orden) del último entreno de ese día */
function lastFor(dayId, ei, type, ord, name){
  for (let i = hist.length - 1; i >= 0; i--){
    const e = hist[i]; if (e.dayId !== dayId) continue;
    /* Por posición; si la rutina cambió de orden (ej. se añadió un ejercicio), lo busca por nombre */
    let ex = e.exercises[ei];
    if (name && (!ex || ex.name !== name)) ex = e.exercises.find(x => x.name === name);
    if (!ex) continue;
    const s = ex.sets.filter(x => x.type === type)[ord];
    if (s && s.done && (((s.kg !== "" || repsOnly(ex)) && s.reps !== "") || (hasVal(s.kgL) && hasVal(s.repsL)))) return { ts: e.ts, kg: s.kg, reps: s.reps, kgL: s.kgL, repsL: s.repsL, rir: s.rir, rpe: s.rpe };
  }
  /* Si A y B traen "última vez" del Excel, el historial guarda la A; la B la saca de su prev */
  const day = CLIENTS[code].days.find(d => d.id === dayId), ex0 = day && day.exercises[ei];
  if (ex0 && ex0.alt && name && ex0.alt.name === name && ex0.sets.some(x => x.prev)){
    const s = ex0.alt.sets.filter(x => x.type === type)[ord], p = s && s.prev ? parsePrev(s.prev) : null;
    const imp = hist.find(e => e.imported && e.dayId === dayId);
    if (p && p.ok) return { ts: imp ? imp.ts : Date.now(), kg: repsOnly(ex0.alt) ? "" : String(p.kg), reps: String(p.reps), rir: null, rpe: null };
  }
  return null;
}
const shortDate = ts => new Date(ts).toLocaleDateString("es-ES", {day:"numeric", month:"short"}).replace(".", "");
function lastHTML(l, side){
  /* Si esa vez se apuntó sin separar por lado (antes de ser unilateral), vale lo mismo para el izquierdo */
  if (l && side === "L") l = hasVal(l.kgL) && hasVal(l.repsL) ? { ...l, kg: l.kgL, reps: l.repsL } : (l.kgL === undefined && l.repsL === undefined && hasVal(l.reps) ? l : null);
  else if (l && !hasVal(l.reps)) l = null;
  if (!l) return `<div class="last"><span class="last-lab">Última vez</span><span class="last-v">Sin registro aún</span></div>`;
  return `<div class="last"><span class="last-lab">Última vez · ${esc(shortDate(l.ts))}</span><span class="last-v num">${hasVal(l.kg) && +l.kg ? `${esc(fmt(l.kg))} kg × ${esc(l.reps)}` : `${esc(l.reps)} reps`}</span>${l.rpe != null ? `<span class="last-x num">RPE ${esc(l.rpe)}</span>` : l.rir != null ? `<span class="last-x num">RPE —</span>` : ""}</div>`;
}

  <div class="finish-bar"><button class="btn" id="finish">Terminar sesión</button></div>`;

  wireHeader();
  app.querySelectorAll(".day").forEach(b => b.onclick = () => { dayIdx = +b.dataset.day; renderSession(); window.scrollTo(0,0); savePos(); });
  app.querySelectorAll(".see").forEach(b => b.onclick = () => {

  });
  app.querySelectorAll(".set").forEach(el => wireSet(el));
  app.querySelectorAll(".ex-note").forEach(w => {
    const k = noteKey(day, +w.dataset.ei), b = w.querySelector(".note-b"), box = w.querySelector("div"), ta = w.querySelector("textarea");
    b.onclick = () => { b.hidden = true; box.hidden = false; ta.focus(); };
    ta.addEventListener("input", () => { if (ta.value.trim()) log[k] = ta.value; else delete log[k]; save(); });
    ta.addEventListener("blur", () => { if (!ta.value.trim()){ box.hidden = true; b.hidden = false; } });

  const keepScroll = fn => { const y = window.scrollY; fn(); save(); renderSession(); window.scrollTo(0, y); };
  app.querySelectorAll(".opt-b").forEach(b => b.onclick = () => keepScroll(() => {
    const k = `${day.id}-${b.dataset.ei}-opt`; if (b.dataset.o === "B" || b.dataset.o === "C") log[k] = b.dataset.o; else delete log[k]; }));
  app.querySelectorAll(".add-aprox").forEach(b => b.onclick = () => keepScroll(() => {
    const kn = `${day.id}-${b.dataset.ei}${sfx(day, +b.dataset.ei)}-xn`; log[kn] = (+log[kn] || 0) + 1; }));
  app.querySelectorAll(".del-x").forEach(b => b.onclick = () => keepScroll(() => {
    const kn = `${day.id}-${b.dataset.ei}${sfx(day, +b.dataset.ei)}-xn`, n = (+log[kn] || 0) - 1;
    delete log[`${day.id}-${b.dataset.ei}${sfx(day, +b.dataset.ei)}-x${n}`]; if (n > 0) log[kn] = n; else delete log[kn]; }));
  app.querySelectorAll(".media").forEach(m => m.querySelectorAll(".m-tab").forEach(t => t.onclick = () => {

  app.querySelectorAll(".warm-ok").forEach(wb => wb.onclick = () => { const k = day.id + "-" + wb.dataset.kind; log[k] = !log[k]; save();

    wb.closest(".warm").classList.toggle("done", !!log[k]); });

  fb.onclick = () => {
    const all = daySets(), done = all.filter(x => x.v.done).length, left = all.length - done;
    if (!done){ toast("Marca al menos una serie con ✓ para terminar"); return; }
    confirmFinish(left);
  };

}

  if (has(/deltoide posterior/)) z.add("del_p");
  if (has(/triceps/)) z.add("tri");
  if (has(/biceps|braquial(?!r)/)) z.add("bi");
  if (has(/braquiorradial|antebrazo/)) z.add("ante");
  if (has(/dorsal/)) z.add("dor");
  if (has(/trapecio medio|romboides|espalda alta/)) z.add("trap_m");
  if (has(/trapecio superior/)) z.add("trap_s");
  if (has(/lumbar/)) z.add("lum");
  if (has(/abdomen/)) z.add("abs");
  if (has(/flexores de cadera/)) z.add("hipf");
  if (has(/gluteo medio|gluteo mayor \(parte superior\)/)) z.add("glu_m");
  if (has(/gluteo(?! medio| mayor \(parte superior\))/)) z.add("glu");
  if (has(/cuadriceps/)) z.add("quad");
  if (has(/aductores/)) z.add("add");
  if (has(/isquiosurales/)) z.add("ham");
  if (has(/gemelos/)) z.add("calf");
  return z;
}

function setRow(day, ex, ei, o, canDel){
  const s = o.s, k = o.k, v = log[k] || {};
  if (ex.check) return `<div class="set${v.done?" done":""}" data-k="${k}">

/* Unilaterales: selector derecho / izquierdo (Brazo por defecto, o ex.limb p. ej. "Pierna"), cada lado con su kg y reps */
function sidesHTML(day, ei, o, k, v){

  const mini = (kg, r) => hasVal(kg) || hasVal(r) ? `${hasVal(kg) ? fmt(+kg) : "—"}×${hasVal(r) ? r : "—"}` : "";
  const blk = (sd, kf, rf) => `<div class="nums" data-side="${sd}"${cur === sd ? "" : " hidden"}>

function wireSet(el){
  const k = el.dataset.k;
  const get = () => (log[k] = log[k] || {});
  ["kg","reps","kgL","repsL","secs"].forEach(f => {
    const inp = document.getElementById(`${k}-${f}`); if (!inp) return;
    inp.addEventListener("input", e => { get()[f] = e.target.value.replace(",", "."); save();
      const sd = f.endsWith("L") ? "L" : "R", b = el.querySelector(`.side[data-s="${sd}"] small`), v = get();
      if (b){ const kg = v[sd === "L" ? "kgL" : "kg"], r = v[sd === "L" ? "repsL" : "reps"];
        b.textContent = hasVal(kg) || hasVal(r) ? `${hasVal(kg) ? fmt(+kg) : "—"}×${hasVal(r) ? r : "—"}` : ""; } });
  });
  el.querySelectorAll(".side").forEach(b => b.onclick = () => {
    get().side = b.dataset.s; save();
    el.querySelectorAll(".side").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    el.querySelectorAll(".nums[data-side]").forEach(n => n.hidden = n.dataset.side !== b.dataset.s);
  });
  el.querySelectorAll(".chips").forEach(group => {
    group.addEventListener("click", e => {
      const b = e.target.closest(".chip"); if (!b) return;
      const f = group.dataset.f, val = f === "rpe" ? +b.dataset.v : b.dataset.v;
      const cur = get()[f];

      group.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b && get()[f] !== null)));
      save();
    });
  });
  el.querySelectorAll(".check").forEach(c => c.onclick = () => {
    const v = get(); v.done = !v.done;
    el.classList.toggle("done", v.done); el.querySelectorAll(".check").forEach(x => x.setAttribute("aria-pressed", String(v.done)));
    save(); updateBar();
  });
}

function daySets(){

const MOTTOS = [

  const upto = isCur ? now.getDate() : dim;
  let count = 0; for (let d = 1; d <= upto; d++) if (crea[dayKey(new Date(m.getFullYear(), m.getMonth(), d))]) count++;
  const pct = upto ? count / upto : 0;
  const note = count === 0 ? (isCur ? "Este mes todavía no hay registros. Cuando la tomes, márcala en Inicio y aquí lo vamos viendo juntos." : "Este mes no hubo registros. Tranqui, lo importante es lo que viene.")

    : pct >= .5 ? "Vamos con todo 🔥 Venís muy bien, ¡a por más!"

function allExercises(){

/* Por sesión: top set (o la serie efectiva más pesada si no hay top) y volumen efectivo del ejercicio */
function exSeries(name){
  const pts = [];
  hist.forEach(e => {
    const ex = e.exercises.find(x => x.name === name); if (!ex) return;
    const work = ex.sets.filter(s => s.done && s.type !== "aprox" && s.kg !== "" && s.reps !== "");
    if (!work.length) return;
    const top = work.find(s => s.type === "top") || work.reduce((a,b) => n0(b.kg) > n0(a.kg) ? b : a);
    pts.push({ ts: e.ts, kg: n0(top.kg), reps: parseInt(top.reps)||0, rir: top.rir, rpe: top.rpe,
      vol: work.reduce((a,s) => a + n0(s.kg) * (parseInt(s.reps)||0), 0) });
  });
  return pts;
}
function chartSVG(pts, key){
  const W = 320, H = 150, L = 34, R = 10, T = 18, B = 22;
  const vals = pts.map(p => p[key]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi){ lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.15; lo = Math.max(0, lo - pad); hi += pad;
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo+hi)/2, hi];
  const line = pts.map((p,i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length-1).toFixed(1)},${H-B}L${x(0).toFixed(1)},${H-B}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución">
    ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L-6}" y="${y(t)+3}" text-anchor="end">${fmt(Math.round(t))}</text>`).join("")}
    <path class="area" d="${area}"/><path class="ln" d="${line}"/>
    ${pts.map((p,i) => `<circle class="pt${i===pts.length-1?" last":""}" cx="${x(i)}" cy="${y(p[key])}" r="4"/>
      <text class="axis" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(shortDate(p.ts))}</text>`).join("")}
    <text class="val" x="${x(pts.length-1)}" y="${y(pts[pts.length-1][key]) - 9}" text-anchor="end">${fmt(pts[pts.length-1][key])}</text>
  </svg>`;
}
function deltaInfo(cur, prev, unit){
  if (prev == null) return { cls:"same", txt:"Primera vez" };
  const d = Math.round((cur - prev) * 10) / 10;
  if (d > 0) return { cls:"up", txt:`▲ +${fmt(d)} ${unit}` };
  if (d < 0) return { cls:"down", txt:`▼ ${fmt(d)} ${unit}` };
  return { cls:"same", txt:"= igual" };
}

/* ---------- Resumen ---------- */
/* ---------- Feedback de progreso: top set de hoy vs. la última vez ----------
   Criterio de Cristian: subir kilos quedándose cerca de las reps pedidas también es progreso;
   bajar peso no se marca como fallo (puede ser por técnica). */
function compareTop(K, R, k, r, tmin){
  const dk = Math.round((K - k) * 10) / 10, dr = R - r, kg = x => `${fmt(Math.abs(x))} kg`;
  if (dk > 0){
    if (dr >= 0) return { cls:"up", badge:`+${kg(dk)}${dr > 0 ? ` · +${dr} reps` : ""}`, note:"Más peso y mismas o más reps. ¡Eso es progresar!" };
    if (!tmin || R >= tmin - 1) return { cls:"up", badge:`+${kg(dk)}`, note:"Subiste peso y te quedaste cerca de las reps pedidas. ¡Bien hecho!" };
    return { cls:"mid", badge:`+${kg(dk)} · −${-dr} reps`, note:"Subiste peso. La próxima intenta acercarte a las reps pedidas." };
  }
  if (dk === 0){
    if (dr > 0) return { cls:"up", badge:`+${dr} reps`, note:"Mismo peso, más repeticiones. ¡Vas para arriba!" };
    if (dr === 0) return { cls:"same", badge:"= igual", note:"Mantuviste tu marca. La próxima, a por una rep más." };
    return { cls:"mid", badge:`−${-dr} reps`, note:"Hoy costó un poco más, pasa. La próxima la recuperas." };
  }
  return { cls:"same", badge:`−${kg(dk)}${dr > 0 ? ` · +${dr} reps` : ""}`, note:"Bajaste peso. Si fue para pulir técnica, también es progreso." };
}
function progressFeedback(day){
  const out = [];
  exs(day).forEach((ex,ei) => {
    const o = setsOf(day,ex,ei).find(x => x.s.type === "top"); if (!o) return;
    let v = log[o.k] || {}, l = lastFor(day.id, ei, "top", 0, ex.name);
    if (repsOnly(ex)){ v = { ...v, kg: hasVal(v.reps) ? 0 : v.kg }; if (l) l = { ...l, kg: hasVal(l.reps) ? 0 : l.kg }; }
    const tmin = parseInt(String(o.s.target)) || null;
    const sides = ex.uni ? [["D","kg","reps"],["I","kgL","repsL"]] : [["","kg","reps"]];
    const parts = sides.map(([lab, kf, rf]) => {
      if (!hasVal(v[kf]) || !hasVal(v[rf])) return null;
      if (!l || !hasVal(l[kf]) || !hasVal(l[rf])) return { lab, cls:"new", badge:"Primera marca", note:"Ya tienes tu referencia para la próxima." };
      return { lab, ...compareTop(+v[kf], parseInt(v[rf]), +l[kf], parseInt(l[rf]), tmin) };
    }).filter(Boolean);
    if (!parts.length) return;
    const rank = { up:3, new:2, same:1, mid:0 };
    const main = parts.reduce((a,b) => rank[b.cls] > rank[a.cls] ? b : a);
    out.push({ name: ex.name, cls: main.cls, note: main.note,
      badge: parts.map(x => (x.lab ? x.lab + " " : "") + x.badge).join(" · ") });
  });
  return out;
}
function feedbackHTML(fb){
  if (!fb.length) return "";

  const head = ups === fb.length ? "¡Progresaste en todo! 🔥" : ups ? `Progresaste en ${ups} de ${fb.length} ejercicios 💪` : "Sesión hecha. Cada entreno suma 💪";
  const ic = { up:"✓", new:"★", same:"=", mid:"↓" };

/* El informe se arma siempre desde la sesión guardada en el historial:

const nf = n => n.toLocaleString("es-ES", {maximumFractionDigits:1});
const longDate = ts => new Date(ts).toLocaleDateString("es-ES", {weekday:"long", day:"numeric", month:"long"});

/* ---------- Informe de sesión (imagen): compacto, con objetivo, última vez y fechas ---------- */
const dm = ts => { const d = new Date(ts); return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`; };
const day0 = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const agoTxt = n => n === 0 ? "hoy" : n === 1 ? "ayer" : `hace ${n} días`;
/* Definición pautada del ejercicio (para sacar el objetivo de reps en sesiones antiguas) */
function rpDef(e, ei, ex){
  const day = CLIENTS[code].days.find(d => d.id === e.dayId); if (!day) return null;
  const is = d => d && (d.name === ex.name || (d.alt && d.alt.name === ex.name) || (d.alt2 && d.alt2.name === ex.name));
  const d = is(day.exercises[ei]) ? day.exercises[ei] : day.exercises.find(is);
  if (!d) return null;
