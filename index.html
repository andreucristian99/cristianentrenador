const rpTarget = (v, def) => v.target || (def && (def.sets.find(s => s.type === v.type) || {}).target) || "";
/* Última vez que hizo ESTE ejercicio (en cualquier día de la rutina), antes de esta sesión */
function rpLast(e, ex){
  const prev = hist.filter(x => x !== e && x.ts < e.ts).sort((a,b) => b.ts - a.ts);
  for (const p of prev){
    const px = p.exercises.find(y => y.name === ex.name); if (!px || px.check) continue;
    const w = px.sets.filter(s => s.done && s.type !== "aprox" && [s.kg, s.reps, s.kgL, s.repsL].some(hasVal));

const rpWhen = p => p.imported ? (p.week || "semana anterior") : dm(p.ts);
/* "60 kg × 10" / "D 20×10 · I 20×9" / "17 reps" */
function rpSet(v, short){
  const one = (k, r) => !hasVal(k) ? (hasVal(r) ? `${r} reps` : "—") : short ? `${fmt(+k)} kg×${hasVal(r) ? r : "—"}` : `${fmt(+k)} kg × ${hasVal(r) ? r : "—"}`;
  if (v.kgL !== undefined) return `D ${one(v.kg, v.reps).replace(" kg × ", "×").replace(" kg×", "×")} · I ${one(v.kgL, v.repsL).replace(" kg × ", "×").replace(" kg×", "×")}`;
  return one(v.kg, v.reps);
}
function entryPaper(e){
  const cl = CLIENTS[code], day = cl.days.find(d => d.id === e.dayId) || {};
  const FB = (typeof entryFeedback === "function" ? entryFeedback(e) : e.fb) || [];
  const all = e.exercises.reduce((a,x) => a + x.sets.length, 0);
  const done = e.exercises.reduce((a,x) => a + x.sets.filter(s => s.done).length, 0);
  const isToday = day0(e.ts) === day0(Date.now());
  /* Última vez que hizo este mismo día de rutina */
  const prevDay = hist.filter(x => x !== e && x.dayId === e.dayId && x.ts < e.ts).sort((a,b) => b.ts - a.ts)[0];
  const prevTxt = !prevDay ? `<span class="rq-chip dim">Primera vez con este día</span>`
    : prevDay.imported ? `<span class="rq-chip dim">Última vez: ${esc(prevDay.week || "semana anterior")}</span>`
    : `<span class="rq-chip dim">Última vez <b>${esc(dm(prevDay.ts))}</b> · ${esc(agoTxt(Math.round((day0(e.ts) - day0(prevDay.ts)) / 864e5)))}</span>`;

  const blocks = e.exercises.map((ex, ei) => {
    const def = rpDef(e, ei, ex), num = String(ei+1).padStart(2,"0");
    const nm = `${esc(ex.name)}${ex.opt === "B" || ex.opt === "C" ? ` <em class="rp-opt">opción ${ex.opt}</em>` : ""}`;
    const noteH = ex.note ? `<p class="rp-note"><b>Nota:</b> ${esc(ex.note)}</p>` : "";
    if (ex.check){
      const ok = ex.sets.some(v => v.done), t = (ex.sets[0] || {}).target, sc = (ex.sets[0] || {}).secs;
      return `<section class="rq-ex"><div class="rq-head"><span class="rq-n">${num}</span><h3>${nm}</h3>${t ? `<span class="rq-obj">Objetivo <b>${esc(t)}</b></span>` : ""}</div>
        <div class="rq-row${ok ? "" : " skip"}"><span class="rq-res">${ok ? "✓ Hecho" : "No marcado"}${sc ? ` · ${esc(sc)} s` : ""}</span></div>${noteH}</section>`;
    }
    const eff = ex.sets.filter(v => v.type !== "aprox");
    const main = eff.find(v => v.type === "top") || eff[0] || ex.sets[0] || {};
    const objMain = rpTarget(main, def);
    const fb = FB.find(x => x.name === ex.name);
    const last = rpLast(e, ex);
    const lastH = last ? `<span class="rq-last">Última vez <b>${esc(rpWhen(last.p))}</b>: ${last.sets.map(s => `<span class="rq-nw">${esc(rpSet(s, true))}</span>`).join(" · ")}</span>`
      : `<span class="rq-last">Primera vez que lo registras</span>`;
    /* Las aproximaciones que no hizo no se muestran (calentar lo decide el cliente) */
    let sn = 0;
    const rows = ex.sets.filter(v => v.type !== "aprox" || [v.kg, v.reps, v.kgL, v.repsL].some(hasVal)).map(v => {
      const snH = v.type !== "aprox" ? `<span class="rq-sn">Serie ${++sn}</span>` : "";
      const has = [v.kg, v.reps, v.kgL, v.repsL].some(hasVal);
      const rd = rpeRead(v.rpe, v.tRir), obj = rpTarget(v, def);
      const objH = v.type !== "aprox" && obj ? `<span class="rq-sobj">— Objetivo <b>${esc(obj)}</b></span>` : "";
      return `<div class="rq-set${has || v.rpe != null ? "" : " skip"}">
        <div class="rq-st"><span class="rp-t ${v.type}">${v.type === "aprox" ? "Aprox." : TYPE_LABEL[v.type] || ""}${v.extra ? " +" : ""}</span>${snH}${objH}</div>
        <div class="rq-row">
        <span class="rq-res">${has ? esc(rpSet(v)) : "Sin registrar"}</span>
        <span class="rq-rpe">${v.rpe != null ? `RPE <b>${esc(v.rpe)}</b>` : ""}</span>
        <span class="rq-rd">${rd ? `<span class="rp-pill ${rd.cls}">${esc(rd.txt)}</span>` : ""}</span>
      </div></div>`;
    }).join("");
    return `<section class="rq-ex">
      <div class="rq-head"><span class="rq-n">${num}</span><h3>${nm}</h3></div>
      <div class="rq-sub">${lastH}${fb ? `<span class="rq-fb ${fb.cls}">${esc(fb.badge)}</span>` : ""}</div>
      ${ex.setupHTML || ""}
      <div class="rq-rows">${rows}</div>${noteH}
    </section>`;
  }).join("");

  return `<div class="paper rq" aria-label="Vista previa del informe">
      <div class="rp-band">
        <div class="rp-logo">Cristian<br><span>Entrenador</span><small>Informe de sesión</small></div>
        <div class="rp-who"><b>${esc(cl.name)}</b><span class="rq-day">${esc(e.dayLabel)}</span></div>
      </div>
      <div class="rq-dates"><span class="rq-chip"><b>${isToday ? "Hoy" : "Entreno"} ${esc(dm(e.ts))}</b></span>${prevTxt}</div>
      <div class="rp-body">
        <div class="rq-congrats">¡CRISTIAN TE FELICITA POR HABER CUMPLIDO UN DÍA MÁS!</div>
        <div class="rq-stats">
          <div><small>Series</small><strong>${done}/${all}</strong></div>
          <div><small>Volumen</small><strong>${fmt(entryVol(e))} kg</strong></div>
          ${day.warm && day.warm.length ? `<div><small>Movilidad</small><strong class="${e.warm ? "ok" : ""}">${e.warm ? "✓" : "—"}</strong></div>` : day.cool && day.cool.length ? `<div><small>Cardio</small><strong class="${e.cool ? "ok" : ""}">${e.cool ? "✓" : "—"}</strong></div>` : ""}
        </div>
        ${blocks}
        <div class="rp-foot"><div><b>Lectura</b> = cómo te quedó el esfuerzo (RPE) frente a lo pautado por Cristian · Volumen sin contar aproximaciones · CristianEntrenador</div></div>
      </div>
    </div>`;
}
/* Resumen en texto para mandarlo por WhatsApp (sin pedir ningún dato: el atleta elige el chat) */
function entryText(e){
  const cl = CLIENTS[code], day = cl.days.find(d => d.id === e.dayId) || {}, FB = entryFeedback(e), n = entryCounts(e);
  const L = [`CRISTIANENTRENADOR · ${cl.name}`, `${e.dayLabel} · ${longDate(e.ts)}`];
  if (day.warm && day.warm.length) L.push(`Calentamiento y movilidad: ${e.warm ? "✓ hecho" : "no marcado"}`);
  if (day.cool && day.cool.length) L.push(`Cardio final: ${e.cool ? "✓ hecho" : "no marcado"}`);
  e.exercises.forEach(ex => {
    const uni = entryUni(ex);
    L.push("", ex.name.toUpperCase() + (ex.opt === "B" || ex.opt === "C" ? ` (opción ${ex.opt})` : ""));
    if (ex.check){ { const sc = (ex.sets[0] || {}).secs; L.push((ex.sets.some(v => v.done) ? "- ✓ Hecho" : "- No marcado") + (sc ? ` · ${sc} s` : "")); } if (ex.note) L.push(`📝 Nota: ${ex.note}`); return; }
    ex.sets.forEach(v => {
      const tr = v.tRir, rd = rpeRead(v.rpe, tr), has = [v.kg, v.reps, v.kgL, v.repsL].some(hasVal);
      if (!has && v.rpe == null){ L.push(`- ${TYPE_LABEL[v.type]}${v.extra ? " extra" : ""}: sin registrar`); return; }
      const kgr = has ? kgx(v, uni) : "sin kg/reps";
      L.push(`- ${TYPE_LABEL[v.type]}${v.extra ? " extra" : ""}: ${kgr}${v.rpe != null ? ` · RPE ${v.rpe}` : ""}${tr != null ? ` (RIR ${tr}${rd ? ` → ${rd.txt}` : ""})` : ""}${v.done ? "" : " · no marcada"}`);
    });
    if (ex.note) L.push(`📝 Nota: ${ex.note}`);
  });
  if (FB.length){ L.push("", "PROGRESO (top set vs. última vez)"); FB.forEach(x => L.push(`${{up:"✅",new:"⭐",same:"➖",mid:"🔸"}[x.cls]} ${x.name}: ${x.badge}`)); }
  L.push("", `${n.done}/${n.all} series · Volumen efectivo ${nf(n.vol)} kg`);
  return L.join("\n");
}
/* Botones de compartir (imagen, PDF, WhatsApp, copiar) sobre un informe ya montado */
function wireShare(sh, e, onShared){
  const cl = CLIENTS[code], note = sh.querySelector("#share-note"), TXT = entryText(e);
  const imgBtn = sh.querySelector("#img"), altBtn = sh.querySelector("#imgalt");
  /* Plan B si WhatsApp (u otra app) da error al recibirla: abrir la imagen para guardarla con pulsación larga */
  altBtn.onclick = () => { if (rep) showReportImage(rep.blob); };
  const slug = t => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const d0 = new Date(e.ts), ds = `${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,"0")}-${String(d0.getDate()).padStart(2,"0")}`;
  const base = `CristianEntrenador_${slug(cl.name)}_${slug(e.dayLabel.split("·")[0])}_${ds}_${String(d0.getHours()).padStart(2,"0")}h${String(d0.getMinutes()).padStart(2,"0")}`;
  let rep = null;
  const saveBtn = sh.querySelector("#save-img"), auto = !!onShared && !!sh.querySelector("#undo");
  mailRow(sh, e, () => rep, base, auto);
  reportRender(sh.querySelector(".paper")).then(r => {
    rep = r; imgBtn.disabled = false; saveBtn.disabled = false; saveBtn.textContent = "📥 Guardar imagen en mi móvil";
    autoSend(sh, e, rep, base, "Cristian");
  }).catch(() => {
    const st = sh.querySelector("#send-st"); st.hidden = false; st.className = "send-st ok";
    st.textContent = "Tranqui: tus series ya quedaron guardadas y Cristian las ve igual en su hoja 💪";
    imgBtn.hidden = true; saveBtn.hidden = true; sh.querySelector("#mail-row").hidden = true;
    note.textContent = "Esta vez no se pudo crear la imagen del informe. No tienes que hacer nada más.";
  });
  /* Guardar la imagen: en iPhone sale el menú con «Guardar imagen»; en Android y ordenador se descarga directa */
  saveBtn.onclick = async () => {
    if (!rep) return;
    const f = new File([rep.blob], base + ".jpg", { type: "image/jpeg" });
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)){
      if (navigator.canShare && navigator.share && navigator.canShare({ files: [f] })){
        try { await navigator.share({ files: [f] }); note.textContent = "Si elegiste «Guardar imagen», ya la tienes en tus Fotos ✓"; return; }
        catch(err){ if (err && err.name === "AbortError") return; }
      }
      showReportImage(rep.blob); return;
    }
    try {
      const url = URL.createObjectURL(f), a = document.createElement("a");
      a.href = url; a.download = f.name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
      note.textContent = "Imagen guardada ✓ La tienes en Descargas (o en tu galería).";
    } catch(err){ showReportImage(rep.blob); }
  };
  imgBtn.onclick = async () => {
    if (!rep) return;
    const out = await shareFile(new File([rep.blob], base + ".jpg", { type: "image/jpeg" }));
    /* Compartida: se cierra sola (y vuelve al inicio al terminar sesión), sin tener que tocar "Listo" */
    if (out === "shared"){
      if (onShared){ onShared(); toast("Imagen compartida ✓ ¡Buen entreno!"); }
      else note.textContent = "Listo ✓ Si la guardaste en Fotos, mándasela a Cristian por WhatsApp.";
    }
    else if (out === "fallback") showReportImage(rep.blob);
  };
}
/* Bloque del mail: pedirlo (una sola vez), cambiarlo, quitarlo o enviarse este informe */
function mailRow(sh, e, getRep, base, auto){
  const box = sh.querySelector("#mail-row"); if (!box) return;
  if (!mailOn()){ box.hidden = true; return; }
  const sendNow = () => {
    const r = getRep(), m = getMail(); if (!r || !m) return Promise.resolve(false);
    return api({ action: "mail", code, id: sid(e), name: base + ".jpg", data: reportJpeg(r.canvas), mail: m })
      .then(x => !!(x && x.ok)).catch(() => false);
  };
  const paint = msg => {
    const m = getMail();
    if (!m){
      box.innerHTML = `<button class="mail-b" id="mail-ask">📩 ¿Quieres recibir tus informes por mail? <u>Toca aquí</u></button>`;
      box.querySelector("#mail-ask").onclick = form; return;
    }
    box.innerHTML = `<p class="mail-st">${msg || (auto ? `📩 También te llega a tu mail: <b>${esc(m)}</b>` : `📩 Tus informes te llegan a <b>${esc(m)}</b>`)}</p>
      <div class="mail-acts">${auto ? "" : `<button class="mail-l" id="mail-send">Enviarme este informe al mail</button>`}<button class="mail-l" id="mail-chg">Cambiar mail</button></div>`;
    box.querySelector("#mail-chg").onclick = form;
    const sb = box.querySelector("#mail-send");
    if (sb) sb.onclick = async () => {
      if (!getRep()){ toast("Espera un segundo, se está preparando la imagen"); return; }
      sb.disabled = true; sb.textContent = "Enviando…";
      const ok = await sendNow();
      paint(ok ? `✓ Enviado a <b>${esc(m)}</b>. Mira tu bandeja (o spam la primera vez).` : "No se pudo enviar ahora. Prueba otra vez en un rato.");
    };
  };
  const form = () => {
    const m0 = getMail();
    box.innerHTML = `<div class="mail-f">
      <label for="mail-in">Tu mail (solo lo pones una vez)</label>
      <input id="mail-in" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="tu@mail.com" value="${esc(m0)}">
      <p class="mail-err" id="mail-err" hidden>Revisa el mail, parece que falta algo.</p>
      <div class="mail-acts"><button class="btn" id="mail-ok">Guardar</button>${m0 ? `<button class="mail-l" id="mail-del">Quitar mail</button>` : ""}<button class="mail-l" id="mail-no">Ahora no</button></div>
      <p class="mail-pp">🔒 Tu mail solo lo usa Cristian para mandarte tus informes de entreno. No se comparte con nadie ni se usa para publicidad. Puedes cambiarlo o quitarlo aquí cuando quieras, o pedirle a Cristian que lo borre.</p></div>`;
    const inp = box.querySelector("#mail-in"); inp.focus();
    box.querySelector("#mail-no").onclick = () => paint();
    const del = box.querySelector("#mail-del");
    if (del) del.onclick = () => { setMail(""); paint(); toast("Listo, ya no te llegan por mail"); };
    box.querySelector("#mail-ok").onclick = async () => {
      const v = inp.value.trim().toLowerCase();
      if (!okMail(v)){ box.querySelector("#mail-err").hidden = false; return; }
      setMail(v);
      paint(`⏳ Guardando y enviándote este informe a <b>${esc(v)}</b>…`);
      const ok = await sendNow();
      paint(ok ? `✓ Listo: desde ahora tus informes te llegan a <b>${esc(v)}</b>. Este ya te lo mandé (mira spam la primera vez).`
               : `✓ Guardado: tus próximos informes te llegan a <b>${esc(v)}</b>.`);
    };
  };
  paint();
}

/* Pregunta de seguridad antes de terminar: así el entreno no se acaba solo por un toque sin querer */
function confirmFinish(left){
  if (document.querySelector(".confirm-end")) return;
  const c = document.createElement("div");
  c.className = "sheet confirm-end";
  c.innerHTML = `<div class="sheet-in" role="dialog" aria-label="Terminar sesión">
    <h2>¿Seguro que quieres terminar esta sesión?</h2>
    <p class="note" style="font-size:15px">${left > 0 ? `Todavía te ${left === 1 ? "falta 1 serie" : `faltan ${left} series`} por marcar. ` : ""}Al terminar se guarda el entreno y se le envía el informe a Cristian.</p>
    <div class="share-row">
      <button class="btn" id="ce-keep">No, sigo entrenando</button>
      <button class="ghost" id="ce-end">Sí, terminar sesión</button>
    </div>
  </div>`;
  document.body.appendChild(c);
  const close = () => c.remove();
  c.querySelector("#ce-keep").onclick = close;
  c.addEventListener("click", ev => { if (ev.target === c) close(); });
  /* El botón de terminar no responde hasta medio segundo después: evita el doble toque accidental */
  const end = c.querySelector("#ce-end"); end.disabled = true;
  setTimeout(() => { end.disabled = false; }, 600);
  end.onclick = () => { close(); showSummary(); };
}
function showSummary(){
  const cl = CLIENTS[code], day = cl.days[dayIdx];
  const FB = progressFeedback(day);
  /* Guardado automático al terminar: se guarda ya, con copia por si quiere deshacer */
  const entryId = "s" + Date.now();
  const keys = Object.keys(log).filter(k => k.startsWith(day.id + "-"));
  const snap = {}; keys.forEach(k => snap[k] = log[k]);
  const e = { id: entryId, ts: Date.now(), dayId: day.id, dayLabel: day.label, block: cl.block || undefined, fb: FB,
    exercises: exs(day).map((ex,ei) => ({ name: ex.name, check: ex.check || undefined, opt: ex.opt || undefined, note: noteOf(day, ei) || undefined, setupHTML: setupPdf(day, ex, ei) || undefined, sets: setsOf(day,ex,ei).map(o => {
      const s = o.s, v = log[o.k] || {};
      if (ex.check) return { type: "ok", target: s.target, secs: hasVal(v.secs) ? String(parseInt(v.secs) || v.secs) : undefined, done: !!v.done };
      return { extra: o.extra || undefined, type: s.type, target: s.target || undefined, kg: v.kg ?? "", reps: v.reps ?? "", ...(ex.uni ? { kgL: v.kgL ?? "", repsL: v.repsL ?? "" } : {}), rpe: v.rpe ?? null, rir: v.rir ?? null, tRir: tRir(ex, s), done: !!v.done };
    })})), warm: !!log[day.id + "-warm"], cool: !!log[day.id + "-cool"]
  };
  const n = entryCounts(e);
  const sh = document.createElement("div");
  sh.className = "sheet";
  sh.innerHTML = `<div class="sheet-in" role="dialog" aria-label="Resumen de la sesión">
    <h2>Sesión guardada</h2>
    <div class="congrats">¡CRISTIAN TE FELICITA POR HABER CUMPLIDO UN DÍA MÁS!</div>
    ${feedbackHTML(FB)}
    <div class="stats">
      <div class="stat"><small>Series hechas</small><strong>${n.done}/${n.all}</strong></div>
      <div class="stat"><small>Volumen efectivo</small><strong>${nf(n.vol)} kg</strong></div>
    </div>
    ${entryPaper(e)}
    ${shareButtons("Ya está guardada en tu historial ✓ El informe le llega solo a Cristian; compartirlo es opcional.",
      `<button class="undo" id="undo">¿Terminaste sin querer? Deshacer y volver a la sesión</button>`)}
  </div>`;
  document.body.appendChild(sh);
  hist.push(e); saveHist(); keys.forEach(k => delete log[k]); save();
  const close = () => { sh.remove(); view = "home"; render(); window.scrollTo(0,0); };
  sh.querySelector("#close").onclick = close;
  sh.addEventListener("click", ev => { if (ev.target === sh) close(); });
  sh.querySelector("#undo").onclick = () => {
    hist = hist.filter(x => x.id !== entryId); saveHist();
    Object.assign(log, snap); save(); sh.remove(); renderSession();
    toast("Listo, sigues con la sesión donde la dejaste");
  };
  wireShare(sh, e, close);
}

/* ---------- Imagen del informe (PNG) ---------- */
async function reportRender(paper){
  if (typeof html2canvas !== "function") throw new Error("sin html2canvas");
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:-10000px;top:0;width:420px;";
  const clone = paper.cloneNode(true);
  clone.style.cssText = "max-height:none;overflow:visible;border-radius:0;box-shadow:none;padding:0;gap:0;width:420px;display:block;";
  box.appendChild(clone); document.body.appendChild(box);
  try {
    /* Nunca se queda colgado: si en 20 s no está, sale el aviso de que las series ya están guardadas */
    const limit = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("tiempo")), ms))]);
    if (document.fonts && document.fonts.ready) await limit(document.fonts.ready, 3000).catch(() => {});
    /* En iPhone, html2canvas espera a que carguen TODAS las fotos de la página (también las de
       "Ver ejercicio", que están ocultas y nunca cargan) y se quedaba en "Preparando la imagen…".
       Solo copiamos el informe: fuera fotos, vídeos e iframes que no son del informe. */
    const skip = el => /^(IMG|IFRAME|VIDEO)$/.test(el.tagName) && !clone.contains(el);
    const canvas = await limit(html2canvas(clone, { scale: 2.5, backgroundColor: "#fbfaf7", logging: false, ignoreElements: skip }), 20000);
    const blob = await limit(new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error("sin imagen")), "image/jpeg", 0.92)), 10000);
    return { canvas, blob };
  } finally { box.remove(); }
}
function reportPdf(canvas){
  const { jsPDF } = window.jspdf;
  const w = 420, h = Math.round(canvas.height * w / canvas.width);
  const doc = new jsPDF({ unit: "pt", format: [w, h], orientation: h >= w ? "portrait" : "landscape", compress: true });
  doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, w, h);
  return doc.output("blob");
}
/* Abre el menú de compartir del móvil (Guardar en Fotos, WhatsApp…); si no existe, descarga el archivo */
async function shareFile(file){
  if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })){
    /* Solo el archivo, sin título: en Android, WhatsApp a veces da error si llega imagen + texto */
    try { await navigator.share({ files: [file] }); return "shared"; }
    catch(e){ if (e && e.name === "AbortError") return "cancel"; return "fallback"; }
  }
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) return "fallback";
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  return "shared";
}
async function showReportImage(blob, why){
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
  const v = document.createElement("div");
  v.className = "imgview"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", "Imagen del informe");
  v.innerHTML = `<p><b>Mantén pulsada la imagen</b> y elige «Guardar en Fotos» o «Descargar imagen». Luego mándasela a Cristian por WhatsApp desde tu galería.</p>
    <img alt="Informe de la sesión" src="${url}">
    <p style="font-size:13px;color:var(--muted)">¿No te deja guardarla? Tranqui: tus series ya quedaron guardadas y Cristian las ve igual en su hoja.</p>
    <button class="ghost" id="imgview-close">Cerrar</button>
`;
  document.body.appendChild(v);
  v.querySelector("#imgview-close").onclick = () => v.remove();
}

if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

if (saved && loadCached(saved)){ login(saved); refreshClient(saved); }
else if (saved) renderLoading(saved);
else renderLogin();
