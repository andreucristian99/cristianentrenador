<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CristianEntrenador</title>
<meta name="description" content="Tu rutina personalizada de VivaGym con CristianEntrenador.">
<meta name="theme-color" content="#0e1330">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CristianEntrenador">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de móvil a una columna (máx 480px), cabecera fija de sesión, tarjetas por ejercicio con series apiladas. Look único navy de marca. */
:root{
  --bg:#0e1330; --surface:#1a2247; --surface-2:#242d5c; --line:rgba(214,222,255,.10);
  --fg:#eef0f9; --muted:#97a0c6; --accent:#ff8a3d; --accent-ink:#1a2247;
  --backoff:#8fb0ff; --backoff2:#c3b5ff; --ok:#53d3a6; --warn:#ffb27a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:480px;margin:0 auto;padding-block:20px 120px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Acceso ---------- */
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:28px}
.brand{font-family:var(--display);font-weight:900;font-size:56px;letter-spacing:.01em;line-height:.9;text-transform:uppercase}
.brand span{color:var(--accent)}
.brand-sub{color:var(--muted);margin-top:8px;max-width:30ch}
.code-box{display:flex;flex-direction:column;gap:12px}
.code-box label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
#code{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;
  font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.18em;text-align:center;text-transform:uppercase}
#code:focus{border-color:var(--accent);outline:none}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:16px;font-weight:700;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:22px;font-size:14px;color:var(--warn)}
.demo-hint{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.demo-hint b{color:var(--fg);letter-spacing:.08em}

/* ---------- Sesión ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.week{font-size:13px;color:var(--muted)}
.out{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto}
.day{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.progress{height:4px;background:var(--surface);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.ex-list{display:flex;flex-direction:column;gap:18px;margin-top:18px}

.ex{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-idx{font-family:var(--display);font-weight:900;font-size:15px;color:var(--accent);letter-spacing:.06em}
.ex-name{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.ex-meta{font-size:13px;color:var(--muted)}
.see{flex:0 0 auto;background:var(--surface-2);border:0;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.cues{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.cues .vid{aspect-ratio:16/9;max-width:100%;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font-size:13px;margin-bottom:6px}
.cues b{color:var(--fg)}
/* Notas de Cristian en pequeño (ex.memo / day.memo) */
.memo{font-size:11.5px;line-height:1.35;color:var(--muted);margin-top:4px}.memo b{color:var(--accent);font-weight:600}
.day-memo{margin:0 0 10px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px}

.set{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.set-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:1px solid currentColor}
.tag.aprox{color:var(--muted)}
.tag.top{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.tag.bo{color:var(--backoff)}
.tag.bo2{color:var(--backoff2)}
.target{font-size:14px;font-weight:600}
.prev{font-size:12px;color:var(--muted);margin-left:auto}
.nums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.9fr) 44px;gap:6px}
.last{align-self:end;min-height:46px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);padding:4px 8px;display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.2}
.last-lab{font-size:9.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last-v{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last-x{font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field input{padding:10px 8px!important;font-size:18px!important}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input{width:100%;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--accent);outline:none}
.check{align-self:end;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;color:var(--muted)}
.set.done .check{background:var(--ok);border-color:var(--ok);color:var(--bg)}
/* Ejercicios de "solo marcar hecho" (estiramientos): sin kg, reps ni RPE */
.ok-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ok-row .field{flex:1;max-width:150px}
.ok-row .field small{text-transform:none;letter-spacing:0;font-weight:400}
.ok-row .check{align-self:end;font-size:15px;font-weight:700;padding:0 18px;min-width:120px}
.tag.ok{color:var(--ok)}
.rp-t.ok{color:#2e8b57}
.set.done .field input{border-color:transparent;color:var(--ok)}
.scale{display:grid;grid-template-columns:38px 1fr;align-items:center;gap:8px}
.scale .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chips{display:grid;gap:4px}
.chips.c10{grid-template-columns:repeat(10,1fr)}
.chips.c4{grid-template-columns:repeat(4,1fr)}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);min-width:0}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips.c4 .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.finish-bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--bg) 35%);
  padding:28px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.finish-bar .btn{display:block;width:100%;max-width:480px;margin:0 auto}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(6,9,26,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{max-height:100dvh;overflow-y:auto;background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;
  padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{margin:0;font-family:var(--display);font-weight:900;font-size:32px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat strong{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.paper{background:#fbfaf7;color:#1a2247;border-radius:10px;padding:16px;max-height:40vh;overflow:auto;font-size:12px;display:flex;flex-direction:column;gap:10px}
.paper-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #ff8a3d;padding-bottom:8px;gap:10px}
.paper-brand{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;line-height:1}
.paper-brand span{color:#e06a1c}
.paper-meta{text-align:right;color:#4a5280;font-size:11px}
.paper h3{margin:0;font-family:var(--display);font-size:15px;font-weight:800;text-transform:uppercase}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#4a5280;font-weight:600;padding:3px 4px;border-bottom:1px solid #d9dcea}
.paper td{padding:4px;border-bottom:1px solid #eceef5}
.paper td.miss{color:#9aa0bd}
.paper-foot{color:#4a5280;font-size:11px}
.share-row{display:flex;flex-direction:column;gap:8px}
.note{font-size:12px;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:600}
/* ---------- Foto y vídeo del ejercicio ---------- */
.media{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.m-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border-radius:10px;padding:3px}
.m-tab{background:none;border:0;border-radius:8px;padding:8px;font-size:13px;font-weight:700;color:var(--muted)}
.m-tab[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.m-pane{display:flex;flex-direction:column;align-items:center;gap:8px}
.short{width:100%;max-width:280px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;display:grid;place-items:center}
.short iframe{width:100%;height:100%;border:0;display:block}
.yt-link{font-size:12px;color:var(--muted)}
.short.wide{max-width:100%;aspect-ratio:16/9}
.v-lab{font-size:12px;color:var(--fg);font-weight:600;align-self:flex-start}
.warm-t a{color:var(--muted);text-decoration:underline;text-decoration-color:rgba(151,160,198,.4);text-underline-offset:2px}
.m-photo{width:100%;max-width:340px;border-radius:14px;display:block;margin:0 auto;background:#fff}

/* ---------- Pestañas Entrenar / Historial ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.tab{background:none;border:0;border-radius:9px;padding:9px;font-weight:700;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ok);color:var(--bg);font-weight:700;padding:12px 18px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* ---------- Historial ---------- */
.h-sec{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.h-title{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;margin:0}
.sub{font-size:13px;color:var(--muted);margin:-6px 0 0}
.picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pick{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.pick[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.metric{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.metric button{background:none;border:0;border-radius:8px;padding:7px;font-size:13px;font-weight:700;color:var(--muted)}
.metric button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big strong{font-family:var(--display);font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--bg)}
.delta.up{color:var(--ok)} .delta.down{color:var(--warn)} .delta.same{color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line)}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart .val{fill:var(--fg);font-size:11px;font-weight:700;font-family:var(--body)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row .d{color:var(--muted);font-size:13px}
.row .v{font-weight:700;font-variant-numeric:tabular-nums}
.row .c{font-size:12px;font-weight:700;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.c.up{color:var(--ok)} .c.down{color:var(--warn)} .c.same{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;background:var(--surface);border-radius:14px;padding:18px;text-align:center}
.sess{background:var(--surface);border-radius:14px;overflow:hidden}
.sess summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.sess summary::-webkit-details-marker{display:none}
.sess .s-day{font-weight:700}
.sess .s-date{font-size:13px;color:var(--muted)}
.sess .s-vol{grid-row:1/3;grid-column:2;text-align:right;font-size:12px;color:var(--muted)}
.sess .s-vol b{display:block;font-family:var(--display);font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.sess[open] summary{border-bottom:1px solid var(--line)}
.sess-body{padding:6px 16px 14px;display:flex;flex-direction:column;gap:12px}
.sess-body h4{margin:6px 0 4px;font-family:var(--display);font-size:16px;font-weight:800;text-transform:uppercase}
.sess-body table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.sess-body th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:3px 4px}
.sess-body td{padding:5px 4px;border-top:1px solid var(--line)}
.sess-body td.miss{color:var(--muted)}
.crea-h{background:var(--surface);border-radius:14px;margin-top:18px;overflow:hidden}
.crea-h summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font-size:14px;font-weight:700}
.crea-h summary::-webkit-details-marker{display:none}
.crea-h summary::after{content:"›";color:var(--muted);font-size:18px;transition:transform .2s}
.crea-h[open] summary::after{transform:rotate(90deg)}
.crea-sum{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.crea-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.cm-nav{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.cm-nav button{background:var(--bg);border:0;border-radius:8px;width:30px;height:28px;font-size:16px;color:var(--fg)}
.cm-nav button:disabled{opacity:.3}
.cm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cm-h{font-size:10px;color:var(--muted);font-weight:700}
.cm-d{font-size:11px;padding:5px 0;border-radius:7px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.cm-d.on{background:var(--ok);color:var(--bg);font-weight:800}
.cm-d.fut{opacity:.35}
.cm-d.now{outline:1.5px solid var(--fg);outline-offset:-1.5px}
.crea-note{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.crea-note span{color:var(--accent);font-weight:700;font-size:12px}
.seed-note{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
/* ---------- Inicio ---------- */
.home{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.welcome{background:linear-gradient(135deg,var(--surface-2),var(--surface));border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px}
.welcome .today{font-size:13px;color:var(--muted)}
.welcome h2{margin:0;font-family:var(--display);font-weight:900;font-size:34px;line-height:1;text-transform:uppercase}
.welcome h2 span{color:var(--accent)}
.welcome p{margin:4px 0 0;color:var(--muted);font-size:14px}
.welcome .motto{margin:6px 0 0;color:var(--fg);font-size:15px;font-weight:700;line-height:1.35}
.blk-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 -6px}
.checkin{width:100%;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;transition:border-color .2s,background .2s}
.checkin .box{width:52px;height:52px;border-radius:14px;border:2px solid var(--muted);display:grid;place-items:center;font-size:26px;font-weight:900;color:transparent;transition:all .2s}
.checkin .ci-t{font-weight:700;font-size:16px}
.checkin .ci-s{font-size:13px;color:var(--muted)}
.checkin .ok{font-family:var(--display);font-weight:900;font-size:24px;color:var(--ok);opacity:0;transform:scale(.6);transition:all .25s}
.checkin[aria-pressed="true"]{border-color:var(--ok);background:rgba(83,211,166,.08)}
.checkin[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.checkin[aria-pressed="true"] .ok{opacity:1;transform:none}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:-4px}
.d7{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}

const PHOTOS = {};
const TYPE_LABEL = {aprox:"Aproximación", top:"Top set", bo:"Back-off", bo2:"Back-off 2", ok:"Hecho"};
const RIR = ["0","1","2","+2"];
/* RIR objetivo: lo pautás vos (en el objetivo de la serie o por ejercicio) */
function tRir(ex, s){
  if (s.type === "aprox" || s.type === "ok" || ex.check) return null;
  if (s.rir != null) return String(s.rir);
  const m = String(s.target).match(/RIR\s*(\+?\d)/);
  return m ? m[1] : (ex.rir != null ? String(ex.rir) : null);
}
function targetTxt(ex, s){
  const r = tRir(ex, s);
  return s.target;
}
/* RPE que marca el atleta -> RIR aproximado (RPE 9 ≈ RIR 1) y comparación con lo pautado */
function rpeRead(rpe, tr){
  if (rpe == null || rpe === "") return null;
  const est = 10 - +rpe, estTxt = est >= 4 ? "4+" : String(est);
  const q = est === 0 ? "fallo" : `~${estTxt}`;
  if (tr == null) return { txt:q, cls:"" };
  const t = tr === "+2" ? 3 : +tr, d = est - t;
  return d >= 2 ? { txt:`${q} suave`, cls:"lo" }
       : d < 0  ? { txt:`${q} pasado`, cls:"hi" }
       :          { txt:`${q} ✓`, cls:"ok" };
}

/* ---------- Opción A / B ----------
   Si la máquina está ocupada, el atleta cambia a la opción B: mismo patrón de movimiento, mismo orden.
   Cada opción guarda sus series por separado y su "última vez" sale de su propio historial. */
function optOf(day, ei){ return day.exercises[ei].alt && log[`${day.id}-${ei}-opt`] === "B" ? "B" : "A"; }
function eff(day, ei){
  const ex = day.exercises[ei];
  if (optOf(day, ei) !== "B") return { ...ex, opt: ex.alt ? "A" : null };
  return { ...ex, ...ex.alt, cues: ex.alt.cues || ex.cues, memo: ex.alt.memo || ex.memo, alt: undefined, opt: "B" };
}
const exs = day => day.exercises.map((_, ei) => eff(day, ei));
const sfx = (day, ei) => optOf(day, ei) === "B" ? "b" : "";

  code = c; store.set("ce-code", c);

    hist = hist.filter(e => !e.seed && !e.imported).concat(seedHistory(c)).sort((a,b) => a.ts - b.ts);

  }
  mySetup = store.get("ce-setup-" + c) || {};

const parsePrev = p => { const m = String(p).replace(",", ".").match(/([\d.]+)\s*×\s*(\d+)/); return m ? {kg:+m[1], reps:+m[2], ok:true} : {kg:0, reps:0, ok:false}; };

function seedHistory(c){
  const cl = CLIENTS[c], out = [], WEEKS = 5, now = new Date();
  /* Atleta nuevo, sin semana anterior: empieza con el historial vacío */
  if (cl.fresh) return out;
  if (cl.lastWeek){
    /* Semana anterior real, cargada desde el Excel de Cristian: una sesión por día */
    cl.days.forEach((day, di) => {
      const wk = day.lastWeek || cl.lastWeek;
      const d = new Date(now); d.setDate(d.getDate() - (cl.days.length - di) * 2 - (wk !== cl.lastWeek ? 7 : 0)); d.setHours(18,30,0,0);
      out.push({ id:`imp-${day.id}-${cl.seedVer||0}`, ts:d.getTime(), dayId:day.id, dayLabel:day.label, imported:true, week:wk,
        /* Si la semana pasada hizo la opción B (prev cargado en la B), el registro va a nombre de la B */
        exercises: day.exercises.map(ex0 => ex0.alt && ex0.alt.sets.some(s => s.prev) && !ex0.sets.some(s => s.prev) ? { ...ex0, ...ex0.alt } : ex0).map(ex => ({ name: ex.name, check: ex.check || undefined, sets: ex.sets.map(s => {
          const [pr, pl] = String(s.prev || "").split("|"), p = parsePrev(pr), q = ex.uni ? parsePrev(pl || pr) : null;
          return { type:s.type, kg:p.ok ? String(p.kg) : "", reps:p.ok ? String(p.reps) : "", ...(q ? { kgL:q.kg ? String(q.kg) : "", repsL:q.reps ? String(q.reps) : "" } : {}),
            rpe:null, rir:null, tRir:tRir(ex, s), done:p.ok };
        })}))
      });
    });
    return out.sort((a,b) => a.ts - b.ts);
  }
  cl.days.forEach((day, di) => {
    for (let w = WEEKS; w >= 1; w--){
      const d = new Date(now); d.setDate(d.getDate() - w*7 + di*3 - 3); d.setHours(18,30,0,0);
      const back = w - 1; // la más reciente coincide con "Última"
      out.push({ id: `seed-${day.id}-${w}`, ts: d.getTime(), dayId: day.id, dayLabel: day.label, seed: true,
        exercises: day.exercises.map(ex => ({ name: ex.name, sets: ex.sets.map(s => {
          const p = parsePrev(s.prev), inc = p.kg >= 40 ? 2.5 : 1;
          const kg = Math.max(0, p.kg - inc * Math.ceil(back * 0.75));
          const reps = Math.max(1, p.reps - (back % 2));
          return { type: s.type, kg: String(kg), reps: String(reps), rpe: s.type === "aprox" ? null : 8, rir: s.type === "aprox" ? null : (s.type === "top" ? "1" : "2"), done: true };
        })}))
      });
    }
  });
  return out.sort((a,b) => a.ts - b.ts);
}
/* Volumen de una serie: en unilaterales suma brazo derecho + izquierdo */
const setVol = v => n0(v.kg) * (parseInt(v.reps)||0) + n0(v.kgL) * (parseInt(v.repsL)||0);
const hasVal = x => x != null && x !== "";
/* Texto kg × reps; en unilaterales "D 12,5×10 · I 12,5×11" */
function kgx(v, uni){
  const one = (kg, r) => `${hasVal(kg) ? fmt(+kg) : "—"} kg × ${hasVal(r) ? r : "—"}`;
  if (!uni) return one(v.kg, v.reps);
  return `D ${one(v.kg, v.reps)} · I ${one(v.kgL, v.repsL)}`;
}
function entryVol(e){
  return e.exercises.reduce((a,ex) => a + ex.sets.filter(s => s.done && s.type !== "aprox").reduce((b,s) => b + setVol(s), 0), 0);
}
/* "Última" sale del historial real si existe; si no, del dato de ejemplo */
/* Series del ejercicio: las pautadas + las aproximaciones que añade el atleta (van detrás de las pautadas) */
function setsOf(day, ex, ei){
  const nX = +log[`${day.id}-${ei}${sfx(day, ei)}-xn`] || 0, out = [], cnt = {};
  const push = (s, k, extra, xi) => { cnt[s.type] = (cnt[s.type] || 0) + 1; out.push({ s, k, extra, xi, ord: cnt[s.type] - 1 }); };
  let lastA = -1; ex.sets.forEach((s,i) => { if (s.type === "aprox") lastA = i; });
  const addX = () => { for (let x = 0; x < nX; x++) push({ type:"aprox", target:"Extra" }, `${day.id}-${ei}${sfx(day, ei)}-x${x}`, true, x); };
  if (lastA < 0) addX();
  ex.sets.forEach((s,si) => { push(s, setKey(day.id, ei + sfx(day, ei), si), false); if (si === lastA) addX(); });
  return out;
}
/* "Última vez": misma serie (mismo tipo y mismo orden) del último entreno de ese día */
function lastFor(dayId, ei, type, ord, name){
  for (let i = hist.length - 1; i >= 0; i--){
    const e = hist[i]; if (e.dayId !== dayId) continue;
    const ex = e.exercises[ei]; if (!ex || (name && ex.name !== name)) continue;
    const s = ex.sets.filter(x => x.type === type)[ord];
    if (s && s.done && ((s.kg !== "" && s.reps !== "") || (hasVal(s.kgL) && hasVal(s.repsL)))) return { ts: e.ts, kg: s.kg, reps: s.reps, kgL: s.kgL, repsL: s.repsL, rir: s.rir, rpe: s.rpe };
  }
  /* Si A y B traen "última vez" del Excel, el historial guarda la A; la B la saca de su prev */
  const day = CLIENTS[code].days.find(d => d.id === dayId), ex0 = day && day.exercises[ei];
  if (ex0 && ex0.alt && name && ex0.alt.name === name && ex0.sets.some(x => x.prev)){
    const s = ex0.alt.sets.filter(x => x.type === type)[ord], p = s && s.prev ? parsePrev(s.prev) : null;
    const imp = hist.find(e => e.imported && e.dayId === dayId);
    if (p && p.ok) return { ts: imp ? imp.ts : Date.now(), kg: String(p.kg), reps: String(p.reps), rir: null, rpe: null };
  }
  return null;
}
const shortDate = ts => new Date(ts).toLocaleDateString("es-ES", {day:"numeric", month:"short"}).replace(".", "");
function lastHTML(l, side){
  if (l && side === "L") l = hasVal(l.kgL) && hasVal(l.repsL) ? { ...l, kg: l.kgL, reps: l.repsL } : null;
  else if (l && !(hasVal(l.kg) && hasVal(l.reps))) l = null;
  if (!l) return `<div class="last"><span class="last-lab">Última vez</span><span class="last-v">Sin registro aún</span></div>`;
  return `<div class="last"><span class="last-lab">Última vez · ${esc(shortDate(l.ts))}</span><span class="last-v num">${esc(fmt(l.kg))} kg × ${esc(l.reps)}</span>${l.rpe != null ? `<span class="last-x num">RPE ${esc(l.rpe)}</span>` : l.rir != null ? `<span class="last-x num">RPE —</span>` : ""}</div>`;
}

    delete log[`${day.id}-${b.dataset.ei}${sfx(day, +b.dataset.ei)}-x${n}`]; if (n > 0) log[kn] = n; else delete log[kn]; }));

function setRow(day, ex, ei, o, canDel){

  </div>`;
  const tagCls = {aprox:"aprox",top:"top",bo:"bo",bo2:"bo2"}[s.type];

    </div>`}
    ${s.type === "aprox" ? "" : `<div class="scale"><span class="lab">RPE <small>(esfuerzo)</small></span><div class="chips c10" data-f="rpe">${
      Array.from({length:10},(_,i)=>`<button class="chip" data-v="${i+1}" aria-pressed="${v.rpe==i+1}">${i+1}</button>`).join("")}</div></div>`}
  </div>`;
}

/* Unilaterales: selector derecho / izquierdo (Brazo por defecto, o ex.limb p. ej. "Pierna"), cada lado con su kg y reps */
function sidesHTML(day, ei, o, k, v){
  const limb = day.exercises[ei].limb || "Brazo", g = limb === "Pierna" ? "a" : "o";
  const cur = v.side === "L" ? "L" : "R", l = lastFor(day.id, ei, o.s.type, o.ord, day.exercises[ei].alt ? eff(day, ei).name : null);
  const mini = (kg, r) => hasVal(kg) || hasVal(r) ? `${hasVal(kg) ? fmt(+kg) : "—"}×${hasVal(r) ? r : "—"}` : "";
  const blk = (sd, kf, rf) => `<div class="nums" data-side="${sd}"${cur === sd ? "" : " hidden"}>
      <label class="field"><span>Kg</span><input id="${k}-${kf}" inputmode="decimal" value="${esc(v[kf]??"")}" placeholder="—"></label>
      <label class="field"><span>Reps</span><input id="${k}-${rf}" inputmode="numeric" value="${esc(v[rf]??"")}" placeholder="—"></label>
      ${lastHTML(l, sd)}
      <button class="check" aria-label="Marcar serie como hecha" aria-pressed="${!!v.done}">✓</button>
    </div>`;
  return `<div class="sides" role="group" aria-label="${limb}">
      <button class="side" data-s="R" aria-pressed="${cur === "R"}">${limb} derech${g}<small>${mini(v.kg, v.reps)}</small></button>
      <button class="side" data-s="L" aria-pressed="${cur === "L"}">${limb} izquierd${g}<small>${mini(v.kgL, v.repsL)}</small></button>
    </div>${blk("R","kg","reps")}${blk("L","kgL","repsL")}`;
}
function wireSet(el){
  const k = el.dataset.k;
  const get = () => (log[k] = log[k] || {});
  ["kg","reps","kgL","repsL","secs"].forEach(f => {
    const inp = document.getElementById(`${k}-${f}`); if (!inp) return;
    inp.addEventListener("input", e => { get()[f] = e.target.value.replace(",", "."); save();
      const sd = f.endsWith("L") ? "L" : "R", b = el.querySelector(`.side[data-s="${sd}"] small`), v = get();
      if (b){ const kg = v[sd === "L" ? "kgL" : "kg"], r = v[sd === "L" ? "repsL" : "reps"];
        b.textContent = hasVal(kg) || hasVal(r) ? `${hasVal(kg) ? fmt(+kg) : "—"}×${hasVal(r) ? r : "—"}` : ""; } });
  });
  el.querySelectorAll(".side").forEach(b => b.onclick = () => {
    get().side = b.dataset.s; save();
    el.querySelectorAll(".side").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    el.querySelectorAll(".nums[data-side]").forEach(n => n.hidden = n.dataset.side !== b.dataset.s);
  });
  el.querySelectorAll(".chips").forEach(group => {
    group.addEventListener("click", e => {
      const b = e.target.closest(".chip"); if (!b) return;
      const f = group.dataset.f, val = f === "rpe" ? +b.dataset.v : b.dataset.v;
      const cur = get()[f];
      get()[f] = cur === val ? null : val;
      group.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b && get()[f] !== null)));
      save();
    });
  });
  el.querySelectorAll(".check").forEach(c => c.onclick = () => {
    const v = get(); v.done = !v.done;
    el.classList.toggle("done", v.done); el.querySelectorAll(".check").forEach(x => x.setAttribute("aria-pressed", String(v.done)));
    save(); updateBar();
  });
}

function allExercises(){
  const seen = new Set(), out = [];
  CLIENTS[code].days.forEach(d => d.exercises.filter(ex => !ex.check).forEach(ex => [ex, ex.alt].forEach(x => { if (x && !seen.has(x.name)){ seen.add(x.name); out.push(x.name); } })));
  return out;
}
/* Por sesión: top set (o la serie efectiva más pesada si no hay top) y volumen efectivo del ejercicio */
function exSeries(name){
  const pts = [];
  hist.forEach(e => {
    const ex = e.exercises.find(x => x.name === name); if (!ex) return;
    const work = ex.sets.filter(s => s.done && s.type !== "aprox" && s.kg !== "" && s.reps !== "");
    if (!work.length) return;
    const top = work.find(s => s.type === "top") || work.reduce((a,b) => n0(b.kg) > n0(a.kg) ? b : a);
    pts.push({ ts: e.ts, kg: n0(top.kg), reps: parseInt(top.reps)||0, rir: top.rir, rpe: top.rpe,
      vol: work.reduce((a,s) => a + n0(s.kg) * (parseInt(s.reps)||0), 0) });
  });
  return pts;
}
function chartSVG(pts, key){
  const W = 320, H = 150, L = 34, R = 10, T = 18, B = 22;
  const vals = pts.map(p => p[key]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi){ lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.15; lo = Math.max(0, lo - pad); hi += pad;
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo+hi)/2, hi];
  const line = pts.map((p,i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length-1).toFixed(1)},${H-B}L${x(0).toFixed(1)},${H-B}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución">
    ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L-6}" y="${y(t)+3}" text-anchor="end">${fmt(Math.round(t))}</text>`).join("")}
    <path class="area" d="${area}"/><path class="ln" d="${line}"/>
    ${pts.map((p,i) => `<circle class="pt${i===pts.length-1?" last":""}" cx="${x(i)}" cy="${y(p[key])}" r="4"/>
      <text class="axis" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(shortDate(p.ts))}</text>`).join("")}
    <text class="val" x="${x(pts.length-1)}" y="${y(pts[pts.length-1][key]) - 9}" text-anchor="end">${fmt(pts[pts.length-1][key])}</text>
  </svg>`;
}
function deltaInfo(cur, prev, unit){
  if (prev == null) return { cls:"same", txt:"Primera vez" };
  const d = Math.round((cur - prev) * 10) / 10;
  if (d > 0) return { cls:"up", txt:`▲ +${fmt(d)} ${unit}` };
  if (d < 0) return { cls:"down", txt:`▼ ${fmt(d)} ${unit}` };
  return { cls:"same", txt:"= igual" };
}

/* ---------- Resumen ---------- */
/* ---------- Feedback de progreso: top set de hoy vs. la última vez ----------
   Criterio de Cristian: subir kilos quedándose cerca de las reps pedidas también es progreso;
   bajar peso no se marca como fallo (puede ser por técnica). */
function compareTop(K, R, k, r, tmin){
  const dk = Math.round((K - k) * 10) / 10, dr = R - r, kg = x => `${fmt(Math.abs(x))} kg`;
  if (dk > 0){
    if (dr >= 0) return { cls:"up", badge:`+${kg(dk)}${dr > 0 ? ` · +${dr} reps` : ""}`, note:"Más peso y mismas o más reps. ¡Eso es progresar!" };
    if (!tmin || R >= tmin - 1) return { cls:"up", badge:`+${kg(dk)}`, note:"Subiste peso y te quedaste cerca de las reps pedidas. ¡Bien hecho!" };
    return { cls:"mid", badge:`+${kg(dk)} · −${-dr} reps`, note:"Subiste peso. La próxima intenta acercarte a las reps pedidas." };
  }
  if (dk === 0){
    if (dr > 0) return { cls:"up", badge:`+${dr} reps`, note:"Mismo peso, más repeticiones. ¡Vas para arriba!" };
    if (dr === 0) return { cls:"same", badge:"= igual", note:"Mantuviste tu marca. La próxima, a por una rep más." };
    return { cls:"mid", badge:`−${-dr} reps`, note:"Hoy costó un poco más, pasa. La próxima la recuperas." };
  }
  return { cls:"same", badge:`−${kg(dk)}${dr > 0 ? ` · +${dr} reps` : ""}`, note:"Bajaste peso. Si fue para pulir técnica, también es progreso." };
}
function progressFeedback(day){
  const out = [];
  exs(day).forEach((ex,ei) => {
    const o = setsOf(day,ex,ei).find(x => x.s.type === "top"); if (!o) return;
    const v = log[o.k] || {}, l = lastFor(day.id, ei, "top", 0, ex.name);
    const tmin = parseInt(String(o.s.target)) || null;
    const sides = ex.uni ? [["D","kg","reps"],["I","kgL","repsL"]] : [["","kg","reps"]];
    const parts = sides.map(([lab, kf, rf]) => {
      if (!hasVal(v[kf]) || !hasVal(v[rf])) return null;
      if (!l || !hasVal(l[kf]) || !hasVal(l[rf])) return { lab, cls:"new", badge:"Primera marca", note:"Ya tienes tu referencia para la próxima." };
      return { lab, ...compareTop(+v[kf], parseInt(v[rf]), +l[kf], parseInt(l[rf]), tmin) };
    }).filter(Boolean);
    if (!parts.length) return;
    const rank = { up:3, new:2, same:1, mid:0 };
    const main = parts.reduce((a,b) => rank[b.cls] > rank[a.cls] ? b : a);
    out.push({ name: ex.name, cls: main.cls, note: main.note,
      badge: parts.map(x => (x.lab ? x.lab + " " : "") + x.badge).join(" · ") });
  });
  return out;
}
function feedbackHTML(fb){
  if (!fb.length) return "";
  const ups = fb.filter(x => x.cls === "up").length;
  const head = ups === fb.length ? "¡Progresaste en todo! 🔥" : ups ? `Progresaste en ${ups} de ${fb.length} ejercicios 💪` : "Sesión hecha. Cada entreno suma 💪";
  const ic = { up:"✓", new:"★", same:"=", mid:"↓" };
  return `<div class="fb"><div class="fb-h">${head}</div>${fb.map(x => `<div class="fb-r ${x.cls}">
      <span class="fb-i" aria-hidden="true">${ic[x.cls]}</span>
      <span class="fb-t"><b>${esc(x.name)}</b><small>${esc(x.note)}</small></span>
      <span class="fb-b">${esc(x.badge)}</span></div>`).join("")}<p class="fb-f">Comparado con tu top set de la última vez. — Cristian</p></div>`;
}
/* El informe se arma siempre desde la sesión guardada en el historial:
   así el de fin de sesión y el que se reabre desde Historial son el mismo. */
const nf = n => n.toLocaleString("es-ES", {maximumFractionDigits:1});
const longDate = ts => new Date(ts).toLocaleDateString("es-ES", {weekday:"long", day:"numeric", month:"long"});
const entryUni = ex => ex.sets.some(s => s.kgL !== undefined);
function entryFeedback(e){
  if (e.fb) return e.fb;
  // Sesiones antiguas: se calcula contra la sesión anterior del mismo día de rutina
  const before = hist.filter(x => x.dayId === e.dayId && x.ts < e.ts && x !== e).sort((a,b) => a.ts - b.ts);
  const dayDef = (CLIENTS[code].days.find(d => d.id === e.dayId) || {}).exercises || [];
  const out = [];
  e.exercises.forEach((ex, ei) => {
    const v = ex.sets.find(s => s.type === "top"); if (!v) return;
    let l = null;
    for (let i = before.length - 1; i >= 0 && !l; i--){
      const px = before[i].exercises[ei]; if (!px || px.name !== ex.name) continue;
      const s = px.sets.filter(x => x.type === "top")[0];
      if (s && s.done && ((s.kg !== "" && s.reps !== "") || (hasVal(s.kgL) && hasVal(s.repsL)))) l = s;
    }
    const def = dayDef[ei] ? (ex.opt === "B" && dayDef[ei].alt ? dayDef[ei].alt : dayDef[ei]) : null;
    const ts0 = def ? def.sets.find(s => s.type === "top") : null;
    const tmin = ts0 ? parseInt(String(ts0.target)) || null : null;
    const sides = entryUni(ex) ? [["D","kg","reps"],["I","kgL","repsL"]] : [["","kg","reps"]];
    const parts = sides.map(([lab, kf, rf]) => {
      if (!hasVal(v[kf]) || !hasVal(v[rf])) return null;
      if (!l || !hasVal(l[kf]) || !hasVal(l[rf])) return { lab, cls:"new", badge:"Primera marca", note:"Ya tienes tu referencia para la próxima." };
      return { lab, ...compareTop(+v[kf], parseInt(v[rf]), +l[kf], parseInt(l[rf]), tmin) };
    }).filter(Boolean);
    if (!parts.length) return;
    const rank = { up:3, new:2, same:1, mid:0 };
    const main = parts.reduce((a,b) => rank[b.cls] > rank[a.cls] ? b : a);
    out.push({ name: ex.name, cls: main.cls, note: main.note, badge: parts.map(x => (x.lab ? x.lab + " " : "") + x.badge).join(" · ") });
  });
  return out;
}
function entryCounts(e){
  const all = e.exercises.flatMap(x => x.sets), done = all.filter(s => s.done);
  return { all: all.length, done: done.length, vol: done.filter(s => s.type !== "aprox").reduce((a,s) => a + setVol(s), 0) };
}
function entryPaper(e){
  const cl = CLIENTS[code], day = cl.days.find(d => d.id === e.dayId) || {}, FB = entryFeedback(e), n = entryCounts(e);
  const c = x => x === undefined || x === null || x === "" ? `<td class="miss r">—</td>` : `<td class="r">${esc(x)}</td>`;
  const tables = e.exercises.map((ex, ei) => { const uni = entryUni(ex);
    if (ex.check){ const done = ex.sets.some(v => v.done), t = (ex.sets[0] || {}).target, sc = (ex.sets[0] || {}).secs;
      return `<section class="rp-ex"><div class="rp-ex-h"><span class="rp-n">${String(ei+1).padStart(2,"0")}</span><h3>${esc(ex.name)}</h3></div><table><tbody><tr${done ? "" : ` class="skip"`}><td><span class="rp-t ok">${done ? "✓ Hecho" : "No marcado"}</span></td><td class="r">${sc ? `<b>${esc(sc)} s</b> · ` : ""}objetivo ${esc(t || "")}</td></tr></tbody></table>${ex.note ? `<p class="rp-note"><b>Nota:</b> ${esc(ex.note)}</p>` : ""}</section>`; }
    return `<section class="rp-ex"><div class="rp-ex-h"><span class="rp-n">${String(ei+1).padStart(2,"0")}</span><h3>${esc(ex.name)}${ex.opt === "B" ? ` <em class="rp-opt">opción B</em>` : ""}</h3></div>${ex.setupHTML || ""}<table><thead><tr><th>Serie</th><th class="r">Kg</th><th class="r">Reps</th><th class="r">RPE</th><th class="r">Objetivo</th><th class="r">Lectura</th></tr></thead><tbody>${
    ex.sets.map(v => { const tr = v.tRir, rd = rpeRead(v.rpe, tr);
      const has = [v.kg, v.reps, v.kgL, v.repsL].some(hasVal) || v.rpe != null;
      const kgv = uni ? (hasVal(v.kg) || hasVal(v.kgL) ? `D ${hasVal(v.kg) ? nf(+v.kg) : "—"} / I ${hasVal(v.kgL) ? nf(+v.kgL) : "—"}` : "") : (v.kg == null || v.kg === "" ? "" : nf(+v.kg));
      const repv = uni ? (hasVal(v.reps) || hasVal(v.repsL) ? `${v.reps || "—"} / ${v.repsL || "—"}` : "") : v.reps;
      return `<tr${has ? "" : ` class="skip"`}><td><span class="rp-t ${v.type}">${TYPE_LABEL[v.type]}${v.extra ? " +" : ""}</span></td>${c(kgv)}${c(repv)}${c(v.rpe)}${c(tr != null ? (tr === "0" ? "Fallo" : "RIR " + tr) : "")}${rd ? `<td class="r"><span class="rp-pill ${rd.cls}">${esc(rd.txt)}</span></td>` : `<td class="miss r">—</td>`}</tr>`; }).join("")
    }</tbody></table>${ex.note ? `<p class="rp-note"><b>Nota:</b> ${esc(ex.note)}</p>` : ""}</section>`; }).join("");
  const hasWarm = !!(day.warm && day.warm.length), hasCool = !!(day.cool && day.cool.length);
  const progHTML = FB.length ? `<div class="rp-prog"><div class="rp-h">Progreso · top set vs. última vez</div>${FB.map(x => `<div class="rp-pr ${x.cls}"><span>${esc(x.name)}</span><em>${esc(x.badge)}</em></div>`).join("")}</div>` : "";
  return `<div class="paper" aria-label="Vista previa del informe">
      <div class="rp-band">
        <div class="rp-logo">Cristian<br><span>Entrenador</span><small>Informe de sesión</small></div>
        <div class="rp-who"><b>${esc(cl.name)}</b><span>${esc(e.block || cl.block || "")}</span><span>${esc(e.dayLabel)} · ${esc(longDate(e.ts))}</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-congrats">¡CRISTIAN TE FELICITA POR HABER CUMPLIDO UN DÍA MÁS!</div>
        <div class="rp-stats">
          <div class="rp-stat"><small>Series</small><strong>${n.done}/${n.all}</strong></div>
          <div class="rp-stat"><small>Volumen</small><strong>${nf(n.vol)} kg</strong></div>
          ${hasWarm ? `<div class="rp-stat"><small>Movilidad</small><strong class="${e.warm ? "ok" : ""}">${e.warm ? "Hecho" : "—"}</strong></div>` : hasCool ? `<div class="rp-stat"><small>Cardio</small><strong class="${e.cool ? "ok" : ""}">${e.cool ? "Hecho" : "—"}</strong></div>` : ""}
        </div>
        ${progHTML}
        ${tables}
        <div class="rp-foot">
          <div><b>Objetivo</b> = RIR pautado por Cristian. <b>Lectura</b> = reps que te quedaban según el esfuerzo (RPE) que marcaste: ✓ en objetivo · suave = te sobraron reps · pasado = más duro de lo pautado.</div>
          <div>Volumen sin contar aproximaciones · CristianEntrenador</div>
        </div>
      </div>
    </div>`;
}
/* Resumen en texto para mandarlo por WhatsApp (sin pedir ningún dato: el atleta elige el chat) */
function entryText(e){
  const cl = CLIENTS[code], day = cl.days.find(d => d.id === e.dayId) || {}, FB = entryFeedback(e), n = entryCounts(e);
  const L = [`CRISTIANENTRENADOR · ${cl.name}`, `${e.dayLabel} · ${longDate(e.ts)}`];
  if (day.warm && day.warm.length) L.push(`Calentamiento y movilidad: ${e.warm ? "✓ hecho" : "no marcado"}`);
  if (day.cool && day.cool.length) L.push(`Cardio final: ${e.cool ? "✓ hecho" : "no marcado"}`);
  e.exercises.forEach(ex => {
    const uni = entryUni(ex);
    L.push("", ex.name.toUpperCase() + (ex.opt === "B" ? " (opción B)" : ""));
    if (ex.check){ { const sc = (ex.sets[0] || {}).secs; L.push((ex.sets.some(v => v.done) ? "- ✓ Hecho" : "- No marcado") + (sc ? ` · ${sc} s` : "")); } if (ex.note) L.push(`📝 Nota: ${ex.note}`); return; }
    ex.sets.forEach(v => {
      const tr = v.tRir, rd = rpeRead(v.rpe, tr), has = [v.kg, v.reps, v.kgL, v.repsL].some(hasVal);
      if (!has && v.rpe == null){ L.push(`- ${TYPE_LABEL[v.type]}${v.extra ? " extra" : ""}: sin registrar`); return; }
      const kgr = has ? kgx(v, uni) : "sin kg/reps";
      L.push(`- ${TYPE_LABEL[v.type]}${v.extra ? " extra" : ""}: ${kgr}${v.rpe != null ? ` · RPE ${v.rpe}` : ""}${tr != null ? ` (RIR ${tr}${rd ? ` → ${rd.txt}` : ""})` : ""}${v.done ? "" : " · no marcada"}`);
    });
    if (ex.note) L.push(`📝 Nota: ${ex.note}`);
  });
  if (FB.length){ L.push("", "PROGRESO (top set vs. última vez)"); FB.forEach(x => L.push(`${{up:"✅",new:"⭐",same:"➖",mid:"🔸"}[x.cls]} ${x.name}: ${x.badge}`)); }
  L.push("", `${n.done}/${n.all} series · Volumen efectivo ${nf(n.vol)} kg`);
  return L.join("\n");
}
/* Botones de compartir (imagen, PDF, WhatsApp, copiar) sobre un informe ya montado */
function wireShare(sh, e){
  const cl = CLIENTS[code], note = sh.querySelector("#share-note"), TXT = entryText(e);
  const imgBtn = sh.querySelector("#img");
  const slug = t => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const d0 = new Date(e.ts), ds = `${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,"0")}-${String(d0.getDate()).padStart(2,"0")}`;
  const base = `CristianEntrenador_${slug(cl.name)}_${slug(e.dayLabel.split("·")[0])}_${ds}`;
  let rep = null;
  reportRender(sh.querySelector(".paper")).then(r => {
    rep = r; imgBtn.disabled = false; imgBtn.textContent = "🖼️ Compartir imagen con Cristian";
  }).catch(() => {
    imgBtn.textContent = "No se pudo crear la imagen"; note.textContent = "Haz una captura de pantalla del informe y mándasela a Cristian.";
  });
  imgBtn.onclick = async () => {
    if (!rep) return;
    const out = await shareFile(new File([rep.blob], base + ".png", { type: "image/png" }));
    if (out === "shared") note.textContent = "Listo ✓ Si la guardaste en Fotos, mándasela a Cristian por WhatsApp.";
    else if (out === "fallback") showReportImage(rep.blob);
  };
}
const shareButtons = (noteTxt, extra) => `<div class="share-row">
      <button class="btn" id="img" disabled>Preparando la imagen…</button>
      <p class="note" id="share-note">${noteTxt}</p>
      <button class="ghost" id="close">Listo</button>${extra || ""}
    </div>`;

function showSummary(){
  const cl = CLIENTS[code], day = cl.days[dayIdx];
  const FB = progressFeedback(day);
  /* Guardado automático al terminar: se guarda ya, con copia por si quiere deshacer */
  const entryId = "s" + Date.now();
  const keys = Object.keys(log).filter(k => k.startsWith(day.id + "-"));
  const snap = {}; keys.forEach(k => snap[k] = log[k]);
  const e = { id: entryId, ts: Date.now(), dayId: day.id, dayLabel: day.label, block: cl.block || undefined, fb: FB,
    exercises: exs(day).map((ex,ei) => ({ name: ex.name, check: ex.check || undefined, opt: ex.opt || undefined, note: noteOf(day, ei) || undefined, setupHTML: setupPdf(day, ex, ei) || undefined, sets: setsOf(day,ex,ei).map(o => {
      const s = o.s, v = log[o.k] || {};
      if (ex.check) return { type: "ok", target: s.target, secs: hasVal(v.secs) ? String(parseInt(v.secs) || v.secs) : undefined, done: !!v.done };
      return { extra: o.extra || undefined, type: s.type, kg: v.kg ?? "", reps: v.reps ?? "", ...(ex.uni ? { kgL: v.kgL ?? "", repsL: v.repsL ?? "" } : {}), rpe: v.rpe ?? null, rir: v.rir ?? null, tRir: tRir(ex, s), done: !!v.done };
    })})), warm: !!log[day.id + "-warm"], cool: !!log[day.id + "-cool"]
  };
  const n = entryCounts(e);
  const sh = document.createElement("div");
  sh.className = "sheet";
  sh.innerHTML = `<div class="sheet-in" role="dialog" aria-label="Resumen de la sesión">
    <h2>Sesión guardada</h2>
    <div class="congrats">¡CRISTIAN TE FELICITA POR HABER CUMPLIDO UN DÍA MÁS!</div>
    ${feedbackHTML(FB)}
    <div class="stats">
      <div class="stat"><small>Series hechas</small><strong>${n.done}/${n.all}</strong></div>
      <div class="stat"><small>Volumen efectivo</small><strong>${nf(n.vol)} kg</strong></div>
    </div>
    ${entryPaper(e)}
    ${shareButtons("Ya está guardada en tu historial ✓ Solo falta enviársela a Cristian. Si algo falla, la puedes volver a compartir desde Historial.",
      `<button class="undo" id="undo">¿Terminaste sin querer? Deshacer y volver a la sesión</button>`)}
  </div>`;
  document.body.appendChild(sh);
  hist.push(e); saveHist(); keys.forEach(k => delete log[k]); save();
  const close = () => { sh.remove(); view = "home"; render(); window.scrollTo(0,0); };
  sh.querySelector("#close").onclick = close;
  sh.addEventListener("click", ev => { if (ev.target === sh) close(); });
  sh.querySelector("#undo").onclick = () => {
    hist = hist.filter(x => x.id !== entryId); saveHist();
    Object.assign(log, snap); save(); sh.remove(); renderSession();
    toast("Listo, sigues con la sesión donde la dejaste");
  };
  wireShare(sh, e);
}

/* Reabrir el informe de una sesión ya guardada (desde Historial) para volver a compartirlo */
function showSavedReport(e){
  const sh = document.createElement("div");
  sh.className = "sheet";
  sh.innerHTML = `<div class="sheet-in" role="dialog" aria-label="Informe de la sesión">
    <h2>Informe de la sesión</h2>
    ${entryPaper(e)}
    ${shareButtons("Es el mismo informe de ese día. Compártelo y mándaselo a Cristian.")}
  </div>`;
  document.body.appendChild(sh);
  const close = () => sh.remove();
  sh.querySelector("#close").onclick = close;
  sh.addEventListener("click", ev => { if (ev.target === sh) close(); });
  wireShare(sh, e);
}

/* ---------- Imagen del informe (PNG) ---------- */
async function reportRender(paper){
  if (typeof html2canvas !== "function") throw new Error("sin html2canvas");
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:-10000px;top:0;width:420px;";
  const clone = paper.cloneNode(true);
  clone.style.cssText = "max-height:none;overflow:visible;border-radius:0;box-shadow:none;padding:0;gap:0;width:420px;display:block;";
  box.appendChild(clone); document.body.appendChild(box);
  try {
    /* Nunca se queda colgado: si en 20 s no está, sale el aviso de hacer captura */
    const limit = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("tiempo")), ms))]);
    if (document.fonts && document.fonts.ready) await limit(document.fonts.ready, 3000).catch(() => {});
    /* En iPhone, html2canvas espera a que carguen TODAS las fotos de la página (también las de
       "Ver ejercicio", que están ocultas y nunca cargan) y se quedaba en "Preparando la imagen…".
       Solo copiamos el informe: fuera fotos, vídeos e iframes que no son del informe. */
    const skip = el => /^(IMG|IFRAME|VIDEO)$/.test(el.tagName) && !clone.contains(el);
    const canvas = await limit(html2canvas(clone, { scale: 2.5, backgroundColor: "#fbfaf7", logging: false, ignoreElements: skip }), 20000);
    const blob = await limit(new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error("sin imagen")), "image/png")), 10000);
    return { canvas, blob };
  } finally { box.remove(); }
}
function reportPdf(canvas){
  const { jsPDF } = window.jspdf;
  const w = 420, h = Math.round(canvas.height * w / canvas.width);
  const doc = new jsPDF({ unit: "pt", format: [w, h], orientation: h >= w ? "portrait" : "landscape", compress: true });
  doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, w, h);
  return doc.output("blob");
}
/* Abre el menú de compartir del móvil (Guardar en Fotos, WhatsApp…); si no existe, descarga el archivo */
async function shareFile(file){
  if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title: "Informe CristianEntrenador" }); return "shared"; }
    catch(e){ if (e && e.name === "AbortError") return "cancel"; return "fallback"; }
  }
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) return "fallback";
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  return "shared";
}
async function showReportImage(blob, why){
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
  const v = document.createElement("div");
  v.className = "imgview"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", "Imagen del informe");
  v.innerHTML = `<p><b>Mantén pulsada la imagen</b> y elige «Guardar en Fotos» o «Descargar imagen». Luego mándasela a Cristian por WhatsApp desde tu galería.</p>
    <img alt="Informe de la sesión" src="${url}">
    <p style="font-size:13px;color:var(--muted)">¿No te deja guardarla? Haz una captura de pantalla de la imagen (o captura con desplazamiento) y mándasela a Cristian.</p>
    <button class="ghost" id="imgview-close">Cerrar</button>
`;
  document.body.appendChild(v);
  v.querySelector("#imgview-close").onclick = () => v.remove();
}
